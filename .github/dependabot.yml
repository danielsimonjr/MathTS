# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates

version: 2
updates:
  # THERE IS NO WORKING DEPENDENCY-UPDATE ECOSYSTEM FOR THIS REPO RIGHT NOW. Both choices fail,
  # so the root entry was REMOVED rather than left to fail weekly. Read this before adding one back.
  #
  #   package-ecosystem: 'bun'  -> "Unsupported bun.lock 'lockfileVersion' 2 in /bun.lock".
  #       Dependabot's bundled bun reads lockfileVersion 1 only; Bun 1.4.2 writes 2.
  #       Measured here on 2026-09-05 (job #1558776447, failure), and still true at 2026-10-01:
  #       many unrelated repos report the same error through September and October 2026.
  #
  #   package-ecosystem: 'npm'  -> "Dependabot detected that Bun is misconfigured in this
  #       repository ... Dependabot's npm_and_yarn ecosystem cannot update bun.lock. Set
  #       package-ecosystem: "bun"". It aborts at file fetching, so nothing is proposed.
  #
  # The npm setting was a deliberate workaround and it WORKED for a month: npm_and_yarn updated
  # the package.json ranges while bun.lock stayed authoritative, regenerated by `bun install`.
  # UPSTREAM KILLED IT. npm_and_yarn gained a hard abort on a bun-managed project between
  # 2026-09-21 and 2026-09-25. The evidence is a clean break, and it is FLEET-WIDE, not local:
  #
  #     repo              2026-09-21   2026-09-28
  #     MathTS            success      failure      (also failed 09-25)
  #     deepthinking-mcp  success      failure
  #     fzf-mcp           success      failure
  #
  # Each repo's config says "npm, NOT bun, DELIBERATELY -- do not fix this back to bun". That
  # advice was right when written and is now a trap: it sends the reader to the OTHER failing
  # option. Dependabot's own error message sends them the same way. Neither works.
  #
  # ⚠ WHAT THIS COSTS, stated because the dashboard will not state it. Automated dependency
  # REMEDIATION for the root is dead, and removing the entry makes it dead QUIETLY instead of
  # dead in red. "0 open Dependabot PRs" now partly means "Dependabot cannot open one". Security
  # ALERTS are unaffected - they come from the dependency graph, not the updater - so the repo
  # keeps reporting vulnerabilities; nothing proposes the fix. Until this is restored, a bump is
  # a human action: `bun outdated`, then `bun update <pkg>`, then commit the regenerated bun.lock.
  #
  # THE REVISIT CONDITION, and it is checkable rather than a vague "later": re-add
  # `package-ecosystem: 'bun'` as soon as Dependabot's bundled bun reads lockfileVersion 2. Test
  # it by setting it and watching ONE scheduled run; the failure is immediate and costs nothing.
  # Do NOT pin Bun back to 1.3.14 to get a v1 lockfile - other repos have done that, and it
  # contradicts this repo's bun@1.4.2 pin.
  #
  # The tools/* directories each hold a real package-lock.json and are NOT covered here on
  # purpose: adding three npm entries would be new PR volume, not a fix for this fault. Their
  # security updates continue to work without a config entry.

  # Enable version updates for GitHub Actions
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
    commit-message:
      prefix: 'chore(ci)'
      include: 'scope'
