# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates

version: 2
updates:
  # Root bun.lock covers every workspace (core/, matrix/, workbook/, …).
  # Do NOT add /packages/{core,matrix,workbook} — those directories do not
  # exist (the real packages live at the repo root) and Dependabot failed
  # weekly against them under the old npm config.
  # npm, NOT bun, DELIBERATELY -- do not "fix" this back to bun.
  # Dependabot's bun support parses only bun.lock lockfileVersion 1, and Bun 1.4.2 writes
  # version 2, so every bun-ecosystem run fails immediately with
  #   "Unsupported bun.lock 'lockfileVersion' 2 in /bun.lock"
  # and NO dependency update can be proposed. Observed on the first run after the Bun
  # migration merged (#274), and previously diagnosed and fixed on deepthinking-mcp (524ada7f)
  # and fzf-mcp (387ee494).
  # Security ALERTS keep working regardless -- they are dependency-graph based -- so the repo
  # still looks healthy while automated REMEDIATION is dead. That makes "0 open PRs" read as
  # health when it partly means "Dependabot cannot open one".
  # The npm ecosystem updates package.json ranges; bun.lock remains authoritative and is
  # regenerated by `bun install` when a bump lands, never by Dependabot. Revisit only when
  # Dependabot's bun parser supports lockfileVersion 2.
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
    open-pull-requests-limit: 10
    groups:
      dev-dependencies:
        dependency-type: 'development'
        patterns:
          - '*'
      production-dependencies:
        dependency-type: 'production'
        patterns:
          - '*'
    ignore:
      # js-yaml is held on 4.x by the root `overrides` security floor (`js-yaml: ^4.3.0`),
      # which is also what tools/create-dependency-graph (its only importer) and
      # @types/js-yaml@4 are written against. A 5.x bump of the root devDependency is
      # silently clamped back to 4.x by that override, so it changes nothing but the
      # manifest -- which is how #275 left the root claiming ^5.4.1 while 4.3.2 was
      # installed. Port the tool to v5 and raise the override in ONE change, then drop this.
      - dependency-name: 'js-yaml'
        update-types: ['version-update:semver-major']
    commit-message:
      prefix: 'chore(deps)'
      include: 'scope'

  # Enable version updates for GitHub Actions
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
    commit-message:
      prefix: 'chore(ci)'
      include: 'scope'
