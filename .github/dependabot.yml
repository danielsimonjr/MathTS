# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates

version: 2
updates:
  # Root bun.lock covers every workspace (core/, matrix/, workbook/, …).
  # Do NOT add /packages/{core,matrix,workbook} — those directories do not
  # exist (the real packages live at the repo root) and Dependabot failed
  # weekly against them under the old npm config.
  - package-ecosystem: 'bun'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
    open-pull-requests-limit: 10
    groups:
      dev-dependencies:
        dependency-type: 'development'
        patterns:
          - '*'
      production-dependencies:
        dependency-type: 'production'
        patterns:
          - '*'
    ignore:
      # TypeScript 7 is blocked by typescript-eslint, not by this repo.
      # @typescript-eslint/eslint-plugin (8.68.0, the current stable) still
      # declares `peer typescript ">=4.8.4 <6.1.0"`, so installs fail ERESOLVE
      # the moment the group pulls typescript 7.x -- which made the whole
      # weekly dev-dependencies PR permanently red and held back the other 19
      # updates in it (see PR #265).
      #
      # Scoped to MAJOR only: 6.x minor/patch updates still flow normally.
      # REMOVE THIS ENTRY once typescript-eslint raises its peer ceiling, and
      # bump typescript + typescript-eslint together in ONE PR.
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
    commit-message:
      prefix: 'chore(deps)'
      include: 'scope'

  # Enable version updates for GitHub Actions
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
    commit-message:
      prefix: 'chore(ci)'
      include: 'scope'
