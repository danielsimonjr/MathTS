# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates

version: 2
updates:
  # Root bun.lock covers every workspace (core/, matrix/, workbook/, …).
  # Do NOT add /packages/{core,matrix,workbook} — those directories do not
  # exist (the real packages live at the repo root) and Dependabot failed
  # weekly against them under the old npm config.
  # npm, NOT bun, DELIBERATELY -- do not "fix" this back to bun.
  # Dependabot's bun support parses only bun.lock lockfileVersion 1, and Bun 1.4.2 writes
  # version 2, so every bun-ecosystem run fails immediately with
  #   "Unsupported bun.lock 'lockfileVersion' 2 in /bun.lock"
  # and NO dependency update can be proposed. Observed on the first run after the Bun
  # migration merged (#274), and previously diagnosed and fixed on deepthinking-mcp (524ada7f)
  # and fzf-mcp (387ee494).
  # Security ALERTS keep working regardless -- they are dependency-graph based -- so the repo
  # still looks healthy while automated REMEDIATION is dead. That makes "0 open PRs" read as
  # health when it partly means "Dependabot cannot open one".
  # The npm ecosystem updates package.json ranges; bun.lock remains authoritative and is
  # regenerated by `bun install` when a bump lands, never by Dependabot. Revisit only when
  # Dependabot's bun parser supports lockfileVersion 2.
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
    open-pull-requests-limit: 10
    groups:
      dev-dependencies:
        dependency-type: 'development'
        patterns:
          - '*'
      production-dependencies:
        dependency-type: 'production'
        patterns:
          - '*'
    ignore:
      # TypeScript 7 is blocked by typescript-eslint, not by this repo.
      # @typescript-eslint/eslint-plugin (8.68.0, the current stable) still
      # declares `peer typescript ">=4.8.4 <6.1.0"`, so installs fail ERESOLVE
      # the moment the group pulls typescript 7.x -- which made the whole
      # weekly dev-dependencies PR permanently red and held back the other 19
      # updates in it (see PR #265).
      #
      # Scoped to MAJOR only: 6.x minor/patch updates still flow normally.
      # REMOVE THIS ENTRY once typescript-eslint raises its peer ceiling, and
      # bump typescript + typescript-eslint together in ONE PR.
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
    commit-message:
      prefix: 'chore(deps)'
      include: 'scope'

  # Enable version updates for GitHub Actions
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
    commit-message:
      prefix: 'chore(ci)'
      include: 'scope'
