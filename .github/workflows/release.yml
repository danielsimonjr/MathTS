name: Release

# Tagging, GitHub Releases, and the in-workflow Publish call are OFF unless the
# repository variable RELEASES_ENABLED is exactly the string `true` (unset is off).
# Releases stay disabled while the PySR roadmap is incomplete; re-enable by setting
# RELEASES_ENABLED=true in Actions → Variables. The version PR step still runs.
#
# Versions packages, tags them, and opens GitHub Releases when enabled. npm publish is the
# Publish workflow (.github/workflows/publish.yml), called from this run when
# the push actually changed a package version and releases are enabled.
#
# What each push does:
# 1. When RELEASES_ENABLED is true, `changeset git-tag` tags every public
#    workspace package whose current version has no tag, and this workflow
#    opens a GitHub Release for each tag it owns (tagger github-actions[bot]).
#    Tags cut by hand are not given a new release. This step runs FIRST, on the
#    checkout of the pushed commit. The changesets action rewrites package.json
#    in the working tree, and a tag cut after it would name the next version on
#    the commit before the version commit. So a push with a pending changeset
#    never tags the next version, and the push that merges the version PR tags
#    the version commit. If this step fails, the version PR step after it does
#    not run; "Re-run failed jobs" repeats both. A skipped tag step (variable
#    unset) is not a failure: the version PR step still runs.
# 2. changesets/action opens or updates the "chore: release packages" PR when
#    `.changeset/*.md` files are pending. With none pending, that step is a no-op.
# 3. If RELEASES_ENABLED is true and this push changed a package.json
#    "version" field, this run calls Publish. `changeset publish` then ships
#    every workspace version that is not on npm yet.
#
# GITHUB_TOKEN-created releases do not fire the `release` event, so other
# workflows never see them. Publish is therefore invoked here with
# workflow_call, in the same run, instead of waiting for that event. A person
# opening a release still triggers Publish via `release: published`, and
# workflow_dispatch on Publish is the catch-up path for versions already on
# main when RELEASES_ENABLED is true.
#
# Do NOT put a `publish:` input back on changesets/action. That input publishes
# on every push that has no pending changesets, including ordinary commits, and
# it is what raced a local publish on 2026-07-27. Do NOT grant `id-token: write`.
# With that permission, changesets skipped an empty NPM_TOKEN, fell back to
# OIDC trusted publishing, and died ENEEDAUTH. Publish authenticates with the
# repository secret NPM, as NODE_AUTH_TOKEN. It does not read NPM_TOKEN.

on:
  push:
    branches: [main, master]
  # Manual dispatch backfills tags and GitHub Releases only when
  # RELEASES_ENABLED is true. It does not publish: there is no push, so no
  # version diff. Use the Publish workflow's workflow_dispatch to publish
  # (that job is gated by the same variable).
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

# contents: write pushes tags and opens releases. pull-requests: write opens
# the version PR. id-token is absent: it exists to mint an OIDC token for npm
# trusted publishing, which this workflow must never attempt.
permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      versions_bumped: ${{ steps.tags.outputs.versions_bumped }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Check Bun matches the packageManager pin
        run: node tools/test/check-bun-version.mjs

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          # 22.x, not 20.x: @changesets/cli v3 declares
          # engines.node '^22.11 || ^24 || >=26'. On Node 20 its bin.js dies with
          # `TypeError: enableCompileCache is not a function` before doing any work.
          node-version: 22.x
          # No `registry-url:` on this job. Publish is a separate workflow and
          # that is where setup-node writes the npmrc for NODE_AUTH_TOKEN.
          # No `cache: npm` — the lockfile is bun.lock now.

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # No build step here: `changeset version` only rewrites package.json,
      # CHANGELOG.md, and (via version-packages) bun.lock. Publish builds.

      # ORDER MATTERS: this step must stay BEFORE the changesets action below. The action
      # runs the version script, which leaves the next versions uncommitted in the working
      # tree, and `changeset git-tag` tags HEAD with the versions it finds there. The script
      # refuses to tag when a package.json differs from HEAD, and
      # tools/test/ensure-package-releases.test.mjs pins this order.
      - name: Tag packages and open GitHub releases
        if: vars.RELEASES_ENABLED == 'true'
        id: tags
        env:
          RELEASES_ENABLED: ${{ vars.RELEASES_ENABLED }}
          BEFORE_SHA: ${{ github.event.before }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: bash .github/scripts/ensure-package-releases.sh

      - name: Create Release Pull Request
        id: changesets
        # SHA-pinned (third-party action). `v1` is a MUTABLE BRANCH, not a tag.
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        # Omitting `publish:` keeps this step version-only. Publish is the
        # job below, and only when this push bumped a package version.
        with:
          # v2 renamed these from `title`/`commit`; the v1 names are now a hard
          # error, not a warning, so they must move with the action bump.
          pr-title: 'chore: release packages'
          commit-message: 'chore: release packages'
          # `changeset version` bumps package.json but not bun.lock, so every release left the
          # workspace versions in bun.lock one release behind. This script refreshes the lock too.
          # v2 name. `version` is a HARD ERROR in v2, like pr-title/commit-message above.
          version-script: bun run version-packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish:
    name: Publish
    needs: release
    if: vars.RELEASES_ENABLED == 'true' && needs.release.outputs.versions_bumped == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/publish.yml
    secrets:
      NPM: ${{ secrets.NPM }}
