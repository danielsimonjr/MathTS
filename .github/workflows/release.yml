name: Release

# VERSIONING ONLY — this workflow does NOT publish to npm, by policy.
#
# It opens/updates the "chore: release packages" PR that applies pending
# `.changeset/*.md` files (bumping versions + writing CHANGELOGs). Delivery to
# the registry is a SEPARATE, LOCAL step: `npm publish` is run by hand from the
# ZBOOK, the only machine holding a valid npm token.
#
# Do NOT re-add a `publish:` input or an NPM_TOKEN/NODE_AUTH_TOKEN secret here.
# It was removed 2026-07-28 after failing every time it had something to do:
# with `id-token: write` granted, changesets skipped the (empty) NPM_TOKEN,
# fell back to npm trusted publishing over OIDC, and died `ENEEDAUTH` — while
# also racing the local publish for the same version numbers.

on:
  push:
    branches: [main, master]
  # Safe to run by hand: this workflow cannot publish, only open a version PR.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

# Least privilege: only what opening the version PR needs.
# `id-token: write` is deliberately absent — it exists solely to mint an OIDC
# token for npm trusted publishing, which this workflow must never attempt.
permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    name: Version
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          # 22.x, not 20.x: @changesets/cli v3 declares
          # engines.node '^22.11 || ^24 || >=26'. On Node 20 its bin.js dies with
          # `TypeError: enableCompileCache is not a function` before doing any work.
          node-version: 22.x
          # No `registry-url:` — that only exists to write an .npmrc wired to
          # NODE_AUTH_TOKEN for publishing, which this workflow does not do.
          # No `cache: npm` — the lockfile is bun.lock now.

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # No build step: `changeset version` only rewrites package.json +
      # CHANGELOG.md. Building was for the publish that no longer happens here;
      # ci.yml is the workflow that actually builds and tests.

      - name: Create Release Pull Request
        id: changesets
        # SHA-pinned (third-party action). `v1` is a MUTABLE BRANCH, not a tag.
        uses: changesets/action@8488615a623b1b9c987934bb89eae8af6a946ac1 # v2.1.1
        # Omitting `publish:` makes this version-only: with pending changesets
        # it opens/updates the release PR; with none, it is a no-op.
        with:
          # v2 renamed these from `title`/`commit`; the v1 names are now a hard
          # error, not a warning, so they must move with the action bump.
          pr-title: 'chore: release packages'
          commit-message: 'chore: release packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
