name: mathjs oracle check

# Weekly check that the compat parity oracle still pins the latest mathjs release
# (#1574). When npm publishes a newer mathjs than the `compat` devDependency pins, the
# job opens (or updates) an issue and fails. The job opens no release and publishes
# nothing. `workflow_dispatch` runs the same check on demand.

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  issues: write
  contents: read

jobs:
  oracle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Compare the latest mathjs with the pinned oracle
        id: check
        run: |
          latest="$(npm view mathjs version)"
          pinned="$(node -e "console.log(require('./compat/package.json').devDependencies.mathjs)")"
          echo "latest=$latest" >> "$GITHUB_OUTPUT"
          echo "pinned=$pinned" >> "$GITHUB_OUTPUT"
          if [ "$latest" = "$pinned" ]; then
            echo "drifted=false" >> "$GITHUB_OUTPUT"
            echo "mathjs oracle is current: $pinned"
          else
            echo "drifted=true" >> "$GITHUB_OUTPUT"
            echo "mathjs $latest is newer than the pinned oracle $pinned"
          fi

      - name: Open or update the drift issue
        if: steps.check.outputs.drifted == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const latest = '${{ steps.check.outputs.latest }}';
            const pinned = '${{ steps.check.outputs.pinned }}';
            const title = `[parity] mathjs oracle update: ${latest}`;
            const body =
              `mathjs ${latest} is on npm; the compat parity oracle pins ${pinned} ` +
              `(\`compat/package.json\`).\n\n` +
              `Bump the pin, regenerate \`compat/src/parity-names.generated.ts\` ` +
              `(\`node compat/scripts/gen-parity-names.mjs\`), diff the mathjs ` +
              `HISTORY.md for behavior changes, and file `[parity]` issues for each ` +
              `behavior change before updating the differential expectations.\n\n` +
              `Opened by the scheduled \`mathjs oracle check\` workflow (#1574).`;
            // Reopen-or-update: find the existing open issue with this title.
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            });
            const hit = existing.data.find((issue) => issue.title === title);
            if (hit) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: hit.number,
                body,
              });
              core.info(`Updated existing drift issue #${hit.number}`);
            } else {
              const created = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['mathjs-compat', 'parity'],
              });
              core.info(`Opened drift issue #${created.data.number}`);
            }

      - name: Fail while the oracle is behind
        if: steps.check.outputs.drifted == 'true'
        run: |
          echo "mathjs ${{ steps.check.outputs.latest }} is newer than the pinned oracle ${{ steps.check.outputs.pinned }}; see the opened issue." >&2
          exit 1
