name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  # A branch pushed by a bot with GITHUB_TOKEN does not fire `push` or
  # `pull_request` -- GitHub's recursion guard suppresses it. That is how the
  # Changesets release PR (`changeset-release/main`) reached BLOCKED with zero
  # runs and all five required contexts missing: nothing was ever going to run
  # them. These two triggers make the branch gaugeable by a human on demand and
  # exercise `main` nightly regardless of who pushed to it.
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: this workflow never pushes commits or opens PRs.
permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: '1'

jobs:
  compile:
    name: Compile & Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 20.x
          cache: 'npm'

      # Pin npm >= 11 before installing. The root package depends on two GIT dependencies
      # (github:danielsimonjr/workerpool and .../typed-function). npm must "prepare" a git dep by
      # running a NESTED `npm install --force`, and npm 10's arborist crashes doing so:
      #   npm error git dep preparation failed
      #   npm error Cannot read properties of null (reading 'edgesOut')
      # Reproduced deterministically 2026-09-04 outside CI: `npx npm@10 install
      # github:danielsimonjr/workerpool` fails with that exact error while npm 11 installs it
      # cleanly. It surfaced only on the Node 22 leg because that line ships the affected npm,
      # while the Node 20 leg's npm predates the regression -- so this read as a flaky/intermittent
      # install for a day. It is neither: it is client-version-specific and fully reproducible.
      # NOTE: this fixes the TRIGGER, not the CAUSE. A git dependency gets no integrity check and
      # its nested prepare resolves with NO lockfile, so its transitive tree floats on every
      # install. Sourcing those two packages from the registry instead of a fork would remove the
      # whole class; that is a dependency-strategy decision, deliberately left alone here.
      - name: Pin npm (git-dep prepare crashes on npm 10)
        run: npm install -g npm@^11.0.0

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Docs export-index drift check
        run: npm run docs:functions:check

      - name: Browser-safety (no node leaks from browser entries)
        run: npm run check:browser-safety

      - name: Audit (high+)
        run: npm audit --audit-level=high

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: compile
    timeout-minutes: 20

    strategy:
      # Independent legs so one Node version failing doesn't cancel the others.
      fail-fast: false
      matrix:
        # Node 18 reached EOL 2026-04 and the toolchain uses Node 20+ APIs
        # (e.g. util.styleText), so 18.x is no longer supported/tested.
        node-version: [20.x, 22.x]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      # Pin npm >= 11 before installing. The root package depends on two GIT dependencies
      # (github:danielsimonjr/workerpool and .../typed-function). npm must "prepare" a git dep by
      # running a NESTED `npm install --force`, and npm 10's arborist crashes doing so:
      #   npm error git dep preparation failed
      #   npm error Cannot read properties of null (reading 'edgesOut')
      # Reproduced deterministically 2026-09-04 outside CI: `npx npm@10 install
      # github:danielsimonjr/workerpool` fails with that exact error while npm 11 installs it
      # cleanly. It surfaced only on the Node 22 leg because that line ships the affected npm,
      # while the Node 20 leg's npm predates the regression -- so this read as a flaky/intermittent
      # install for a day. It is neither: it is client-version-specific and fully reproducible.
      # NOTE: this fixes the TRIGGER, not the CAUSE. A git dependency gets no integrity check and
      # its nested prepare resolves with NO lockfile, so its transitive tree floats on every
      # install. Sourcing those two packages from the registry instead of a fork would remove the
      # whole class; that is a dependency-strategy decision, deliberately left alone here.
      - name: Pin npm (git-dep prepare crashes on npm 10)
        run: npm install -g npm@^11.0.0

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    needs: compile
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 20.x
          cache: 'npm'

      # Pin npm >= 11 before installing. The root package depends on two GIT dependencies
      # (github:danielsimonjr/workerpool and .../typed-function). npm must "prepare" a git dep by
      # running a NESTED `npm install --force`, and npm 10's arborist crashes doing so:
      #   npm error git dep preparation failed
      #   npm error Cannot read properties of null (reading 'edgesOut')
      # Reproduced deterministically 2026-09-04 outside CI: `npx npm@10 install
      # github:danielsimonjr/workerpool` fails with that exact error while npm 11 installs it
      # cleanly. It surfaced only on the Node 22 leg because that line ships the affected npm,
      # while the Node 20 leg's npm predates the regression -- so this read as a flaky/intermittent
      # install for a day. It is neither: it is client-version-specific and fully reproducible.
      # NOTE: this fixes the TRIGGER, not the CAUSE. A git dependency gets no integrity check and
      # its nested prepare resolves with NO lockfile, so its transitive tree floats on every
      # install. Sourcing those two packages from the registry instead of a fork would remove the
      # whole class; that is a dependency-strategy decision, deliberately left alone here.
      - name: Pin npm (git-dep prepare crashes on npm 10)
        run: npm install -g npm@^11.0.0

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test with coverage
        run: npm run test:coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  browser:
    name: Browser (WebGPU smoke)
    runs-on: ubuntu-latest
    needs: compile
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Install Mesa lavapipe (software Vulkan adapter for WebGPU)
        run: |
          sudo apt-get update -y
          sudo apt-get install -y mesa-vulkan-drivers libegl1

      # Pin npm >= 11 before installing. The root package depends on two GIT dependencies
      # (github:danielsimonjr/workerpool and .../typed-function). npm must "prepare" a git dep by
      # running a NESTED `npm install --force`, and npm 10's arborist crashes doing so:
      #   npm error git dep preparation failed
      #   npm error Cannot read properties of null (reading 'edgesOut')
      # Reproduced deterministically 2026-09-04 outside CI: `npx npm@10 install
      # github:danielsimonjr/workerpool` fails with that exact error while npm 11 installs it
      # cleanly. It surfaced only on the Node 22 leg because that line ships the affected npm,
      # while the Node 20 leg's npm predates the regression -- so this read as a flaky/intermittent
      # install for a day. It is neither: it is client-version-specific and fully reproducible.
      # NOTE: this fixes the TRIGGER, not the CAUSE. A git dependency gets no integrity check and
      # its nested prepare resolves with NO lockfile, so its transitive tree floats on every
      # install. Sourcing those two packages from the registry instead of a fork would remove the
      # whole class; that is a dependency-strategy decision, deliberately left alone here.
      - name: Pin npm (git-dep prepare crashes on npm 10)
        run: npm install -g npm@^11.0.0

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Build (required for workspace package resolution)
        run: npm run build

      - name: Browser smoke tests (WebGPU)
        run: npm run test:browser
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          GALLIUM_DRIVER: llvmpipe
