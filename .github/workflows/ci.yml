name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  # A branch pushed by a bot with GITHUB_TOKEN does not fire `push` or
  # `pull_request` -- GitHub's recursion guard suppresses it. That is how the
  # Changesets release PR (`changeset-release/main`) reached BLOCKED with zero
  # runs and all five required contexts missing: nothing was ever going to run
  # them. These two triggers make the branch gaugeable by a human on demand and
  # exercise `main` nightly regardless of who pushed to it.
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: this workflow never pushes commits or opens PRs.
permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: '1'

jobs:
  compile:
    name: Compile & Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Bun is the monorepo package manager and, with bunfig [run].bun = true, the
      # runtime of every `bun run` script (vitest, asc, tsc, tsup, turbo included).
      # This job needs no Node: every step runs through Bun. Only the Test matrix
      # installs Node, to run the suite and a dist smoke test on real Node (see `test`).
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      # TEMP probe (removed before review): any `node` call outside Bun's own shim fails.
      - name: Poison node on PATH (probe)
        run: |
          mkdir -p "$RUNNER_TEMP/nonode"
          echo '#!/bin/sh' > "$RUNNER_TEMP/nonode/node"
          echo 'echo "PROBE: node was called: $*" >&2; exit 97' >> "$RUNNER_TEMP/nonode/node"
          chmod +x "$RUNNER_TEMP/nonode/node"
          echo "$RUNNER_TEMP/nonode" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The AssemblyScript wasm must be COMPILED before `bun run build`, which only
      # copies it (matrix/scripts/copy-wasm.mjs). assembly/build/ is gitignored, so a
      # fresh runner never has the source, and copy-wasm.mjs warns and exits 0 when it is
      # missing -- so the build reports SUCCESS while emitting no wasm, and
      # wasm-resolve.test.ts then fails on the absent artifact in every test job.
      # `Compile & Lint` passes throughout because it never asserts the artifact exists.
      # Green locally, red on CI, for as long as a developer's ignored assembly/build/
      # still holds a wasm from an earlier manual run.
      - name: Build AssemblyScript wasm
        run: bun run build:wasm

      - name: Build
        run: bun run build

      - name: Type check
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Docs export-index drift check
        run: bun run docs:functions:check

      - name: Browser-safety (no node leaks from browser entries)
        run: bun run check:browser-safety

      - name: Audit (high+)
        # Bun audit covers the bun.lock tree. Same high+ floor as the old
        # `npm audit --audit-level=high` gate (accepted residual esbuild low
        # advisory is documented in CLAUDE.md Known Issues).
        run: bun audit --audit-level=high

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: compile
    timeout-minutes: 20

    strategy:
      # Independent legs so one Node version failing doesn't cancel the others.
      # `bun run test` runs every package script on BUN ([run] bun = true), so it
      # proves nothing about Node. Each leg therefore ALSO runs the full suite under
      # vitest on the matrix Node, plus a smoke test of the built dist, by calling
      # `node` directly (a `bun run` script would put them back on Bun).
      fail-fast: false
      matrix:
        # Node 18 reached EOL 2026-04 and the toolchain uses Node 20+ APIs
        # (e.g. util.styleText), so 18.x is no longer supported/tested.
        node-version: [20.x, 22.x]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The AssemblyScript wasm must be COMPILED before `bun run build`, which only
      # copies it (matrix/scripts/copy-wasm.mjs). assembly/build/ is gitignored, so a
      # fresh runner never has the source, and copy-wasm.mjs warns and exits 0 when it is
      # missing -- so the build reports SUCCESS while emitting no wasm, and
      # wasm-resolve.test.ts then fails on the absent artifact in every test job.
      # `Compile & Lint` passes throughout because it never asserts the artifact exists.
      # Green locally, red on CI, for as long as a developer's ignored assembly/build/
      # still holds a wasm from an earlier manual run.
      - name: Build AssemblyScript wasm
        run: bun run build:wasm

      - name: Build
        run: bun run build

      - name: Test (Bun runtime)
        run: bun run test

      # Every package's tests under vitest on the matrix Node, plus the root suites
      # and the assembly Node test scripts. Prints a `[runtime-probe]` line.
      - name: Test on Node ${{ matrix.node-version }} (vitest)
        run: node tools/test/run-vitest-node.mjs

      # Import each published package by name (Node resolves its `exports`) and call
      # one representative function from the built dist.
      - name: Smoke test dist on Node ${{ matrix.node-version }}
        run: node tools/test/smoke-dist-node.mjs

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    needs: compile
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      # TEMP probe (removed before review): any `node` call outside Bun's own shim fails.
      - name: Poison node on PATH (probe)
        run: |
          mkdir -p "$RUNNER_TEMP/nonode"
          echo '#!/bin/sh' > "$RUNNER_TEMP/nonode/node"
          echo 'echo "PROBE: node was called: $*" >&2; exit 97' >> "$RUNNER_TEMP/nonode/node"
          chmod +x "$RUNNER_TEMP/nonode/node"
          echo "$RUNNER_TEMP/nonode" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The AssemblyScript wasm must be COMPILED before `bun run build`, which only
      # copies it (matrix/scripts/copy-wasm.mjs). assembly/build/ is gitignored, so a
      # fresh runner never has the source, and copy-wasm.mjs warns and exits 0 when it is
      # missing -- so the build reports SUCCESS while emitting no wasm, and
      # wasm-resolve.test.ts then fails on the absent artifact in every test job.
      # `Compile & Lint` passes throughout because it never asserts the artifact exists.
      # Green locally, red on CI, for as long as a developer's ignored assembly/build/
      # still holds a wasm from an earlier manual run.
      - name: Build AssemblyScript wasm
        run: bun run build:wasm

      - name: Build
        run: bun run build

      - name: Test with coverage
        run: bun run test:coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  browser:
    name: Browser (WebGPU smoke)
    runs-on: ubuntu-latest
    needs: compile
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      # TEMP probe (removed before review): any `node` call outside Bun's own shim fails.
      - name: Poison node on PATH (probe)
        run: |
          mkdir -p "$RUNNER_TEMP/nonode"
          echo '#!/bin/sh' > "$RUNNER_TEMP/nonode/node"
          echo 'echo "PROBE: node was called: $*" >&2; exit 97' >> "$RUNNER_TEMP/nonode/node"
          chmod +x "$RUNNER_TEMP/nonode/node"
          echo "$RUNNER_TEMP/nonode" >> "$GITHUB_PATH"

      - name: Install Mesa lavapipe (software Vulkan adapter for WebGPU)
        run: |
          sudo apt-get update -y
          sudo apt-get install -y mesa-vulkan-drivers libegl1

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright browsers
        run: bunx --bun playwright install chromium --with-deps

      # The AssemblyScript wasm must be COMPILED before `bun run build`, which only
      # copies it (matrix/scripts/copy-wasm.mjs). assembly/build/ is gitignored, so a
      # fresh runner never has the source, and copy-wasm.mjs warns and exits 0 when it is
      # missing -- so the build reports SUCCESS while emitting no wasm, and
      # wasm-resolve.test.ts then fails on the absent artifact in every test job.
      # `Compile & Lint` passes throughout because it never asserts the artifact exists.
      # Green locally, red on CI, for as long as a developer's ignored assembly/build/
      # still holds a wasm from an earlier manual run.
      - name: Build AssemblyScript wasm
        run: bun run build:wasm

      - name: Build (required for workspace package resolution)
        run: bun run build

      - name: Browser smoke tests (WebGPU)
        run: bun run test:browser
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          GALLIUM_DRIVER: llvmpipe
