name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    # `cursor/p7-*` is the Phase 7 stack: every PR above P7-0 bases on its parent branch, and a
    # base filter of main alone leaves each of them without a CI run. Drop the pattern when the
    # stack has merged.
    # `cursor/**` keeps stacked and proof pull requests targetable (for example a docs-only
    # verification PR that bases on a feature branch).
    branches: [main, master, 'cursor/p7-*', 'cursor/**']
  # A branch pushed by a bot with GITHUB_TOKEN does not fire `push` or
  # `pull_request` -- GitHub's recursion guard suppresses it. That is how the
  # Changesets release PR (`changeset-release/main`) reached BLOCKED with zero
  # runs and all five required contexts missing: nothing was ever going to run
  # them. These two triggers make the branch gaugeable by a human on demand and
  # exercise `main` nightly regardless of who pushed to it.
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: this workflow never pushes commits or opens PRs.
permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: '1'

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Classify changed paths
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! changed_output=$(git diff --name-only "$BASE_SHA...$HEAD_SHA"); then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "$changed_output" ]; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          printf '%s\n' "$changed_output" | GITHUB_EVENT_NAME=pull_request node tools/ci/classify-pr-changes.mjs >> "$GITHUB_OUTPUT"

  compile:
    name: Compile & Lint
    runs-on: ubuntu-latest
    needs: changes
    timeout-minutes: 15
    # pull-requests: read lets the Changelog fragment step list the PR's changed
    # files through gh; contents: read is the workflow default, restated because
    # a job-level permissions block replaces the workflow-level one.
    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Bun is the monorepo package manager and, with bunfig [run].bun = true, the
      # runtime of every `bun run` script (vitest, asc, tsc, tsdown, turbo included).
      # Every step of this job runs through Bun, except the last steps, which run the release
      # script tests and the packaging checks on Node 22 (see below). The Test matrix installs
      # Node to run the vitest suite and a dist smoke test on real Node (see `test`).
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Check Bun matches the packageManager pin
        run: node tools/test/check-bun-version.mjs

      # Every PR that changes release-relevant code records its changelog entry
      # as a changelog-fragments/*.md file instead of editing CHANGELOG.md (the
      # top of [Unreleased] is one line, so parallel hand-edits conflict). The
      # release version PR assembles the fragments newest first. gh needs
      # pull-requests: read, which this job grants (see its permissions block).
      - name: Changelog fragment
        if: github.event_name == 'pull_request' && github.head_ref != 'changeset-release/main'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: node tools/test/check-changelog-fragment.mjs --pr "${{ github.event.pull_request.number }}"

      - name: Check that the version PR versions every changed package
        if: github.event_name == 'pull_request' && github.head_ref == 'changeset-release/main'
        run: |
          git fetch --tags --depth=1 origin
          node tools/test/check-release-source-versions.mjs

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Documentation-only pull request
        if: needs.changes.outputs.docs_only == 'true'
        run: |
          echo "Documentation-only changes: skipping build, typecheck, packaging, and consumer checks."
          echo "Required jobs still run; heavy steps in Test, Coverage, and Browser no-op."

      # `typecheck`, `test` and `test:coverage` read `dist/` of the package they check and of the
      # packages that its tests import or compile. A missing Turbo edge lets the `build` of such a
      # package clean `dist/` mid-run. The check reads the resolved task graph, so it needs no build.
      - name: Typecheck task graph
        if: needs.changes.outputs.docs_only != 'true'
        run: |
          node --test tools/test/check-typecheck-graph.test.mjs
          node tools/test/check-typecheck-graph.mjs

      # `bun run build` compiles the AssemblyScript wasm itself: turbo.json orders
      # matrix#build and functions#build after @danielsimonjr/mathts-wasm#build, and their
      # copy-wasm.mjs steps fail when the binary is missing. (A separate `build:wasm` step
      # used to paper over a race between that copy and `asc`.)
      - name: Build
        if: needs.changes.outputs.docs_only != 'true'
        run: bun run build

      - name: Type check
        if: needs.changes.outputs.docs_only != 'true'
        run: bun run typecheck

      - name: Lint
        if: needs.changes.outputs.docs_only != 'true'
        run: bun run lint

      # Guard: the pre-commit hook formats only staged files, so drift
      # accumulated unseen until this check ran nowhere. Keep it in CI.
      - name: Format check
        run: bun run format:check

      - name: Docs-only classifier and manifest guard
        run: |
          node --test tools/test/classify-pr-changes.test.mjs
          node --test tools/test/docs-only-ci-guard.test.mjs

      # The dependency-graph reports in docs/Architecture are generated and not committed
      # (.gitignore names them), so a clean checkout has none of them. This step writes them and
      # holds two gates that read them: the file census (`docs:deps` fails when a tracked .ts is
      # missing from it) and the duplicate-symbol gate (a new TRUE_DUPLICATE beyond
      # docs/Architecture/duplicate-baseline.json fails). The steps below read the reports:
      # `docs:functions:check` reads package-export-surfaces.json and `check:browser-safety`
      # reads dependency-graph.json. It needs the wasm that `bun run build` wrote.
      #
      # The first two commands hold the invariants that a merge of main can break with no
      # conflict left to see: git tracks no file that .gitignore names in docs/Architecture (a
      # merge that takes main's side of a deleted report brings the report back), and no tracked
      # document there has a claim row for a count that moves with a file, an export or a line.
      - name: Dependency graph and file census
        if: needs.changes.outputs.docs_only != 'true'
        run: |
          tracked=$(git ls-files -ci --exclude-standard -- docs/Architecture)
          if [ -n "$tracked" ]; then
            echo "::error::git tracks a generated report that .gitignore names. Run: git rm --cached <file>"
            echo "$tracked"
            exit 1
          fi
          if git grep -nE '^\| *(totalExports|totalTypeScriptFiles|totalLinesOfCode) *\|' -- docs/Architecture; then
            echo "::error::a document in docs/Architecture claims a file, export or line count (the rows above). Delete the rows."
            exit 1
          fi
          bun run docs:deps
          bun run check:duplicates:fast

      - name: Docs export-index drift check
        if: needs.changes.outputs.docs_only != 'true'
        run: bun run docs:functions:check

      # The six node:test files of the dependency-graph generator. Nothing else ran them, so
      # a generator edit could break the reports (or their stable order) with every check green.
      - name: Dependency-graph generator tests
        if: needs.changes.outputs.docs_only != 'true'
        run: bun run docs:deps:test

      - name: Browser-safety (no node leaks from browser entries)
        if: needs.changes.outputs.docs_only != 'true'
        run: bun run check:browser-safety

      # esbuild platform=neutral of the published entries (#708). The source scan
      # above does not bundle dependencies; this step does.
      - name: Neutral browser bundles
        if: needs.changes.outputs.docs_only != 'true'
        run: node tools/test/browser-bundle-neutral.mjs

      # The README block of function counts states the count of the released version. The version
      # PR updates it (`version-packages` runs the sync), so a pull request does not edit it and no
      # two pull requests conflict on it.
      - name: README function stats
        if: needs.changes.outputs.docs_only != 'true'
        run: node --test tools/test/sync-readme-functions-stats.test.mjs

      # The generators, and the Site workflow: its deploy steps run in bash against a local
      # bare gh-pages repository and stub npm and curl programs.
      - name: Site generators and Site workflow
        if: needs.changes.outputs.docs_only != 'true'
        run: node --test tools/test/site-generators.test.mjs tools/test/site-workflow.test.mjs

      - name: Bundle size and tree-shake record
        if: needs.changes.outputs.docs_only != 'true'
        run: |
          node --test tools/test/check-bundle-budget.test.mjs
          node tools/test/check-bundle-budget.mjs

      # The changelog-fragment assembler and the gate that requires one fragment
      # per release-relevant PR (docs-only PRs are exempt). The assembler itself
      # runs only in the release version PR; here its merge logic runs under
      # node:test with fixtures.
      - name: Changelog fragment gate
        run: |
          node --test tools/release/assemble-changelog.test.mjs tools/test/check-changelog-fragment.test.mjs
          node tools/test/check-changelog-fragment.mjs --files CHANGELOG.md

      # The step above is the development build (`build`: unminified). `build:prod` adds
      # --minify --treeshake and nothing else built it, so a failure there was invisible until
      # someone ran it by hand. It runs last because it rewrites dist/ with minified output.
      - name: Build (production)
        if: needs.changes.outputs.docs_only != 'true'
        run: bun run build:prod

      - name: Audit (high+)
        if: needs.changes.outputs.docs_only != 'true'
        # Bun audit covers the bun.lock tree. Same high+ floor as the old
        # `npm audit --audit-level=high` gate. Two audits run: the full tree skips each
        # advisory in tools/test/audit-ignore.json (each entry names its issue and its
        # removal condition), and the production tree (`--prod`) skips none. Retries
        # registry outages only (`tools/test/bun-audit-retry.mjs`); a real high+ advisory
        # still fails on first try.
        run: node tools/test/bun-audit-retry.mjs

      - name: Re-export types append tool
        if: needs.changes.outputs.docs_only != 'true'
        run: node --test tools/test/append-re-export-types.test.mjs

      - name: Runtime dependency lock
        if: needs.changes.outputs.docs_only != 'true'
        run: |
          node --test tools/test/check-runtime-deps.test.mjs
          node tools/test/check-runtime-deps.mjs

      # Tool tests that no workflow used to run. `check:browser-safety` is the query
      # tool's `--check-browser-safety` mode, `docs:roadmap-check` is the roadmap checker,
      # the scanner that `smoke-dist-node.mjs` uses to find a Node builtin in a built browser
      # entry is tested without a build, and the docs dist-freshness preflight uses its own
      # fixtures. The first two run under `bun test` through their root scripts. The last three
      # are direct `node --test`, as the other `tools/test` files are. They sit just before
      # the Node 22 setup below, so none of them sees that Node.
      - name: Dependency-graph query tests
        if: needs.changes.outputs.docs_only != 'true'
        run: bun run docs:graph:test

      - name: Roadmap check tests
        if: needs.changes.outputs.docs_only != 'true'
        run: bun run docs:roadmap-check:test

      - name: Dist builtin scanner tests
        if: needs.changes.outputs.docs_only != 'true'
        run: node --test tools/test/dist-node-imports.test.mjs

      - name: Docs dist-freshness tests
        if: needs.changes.outputs.docs_only != 'true'
        run: node --test tools/test/dist-freshness.test.mjs

      # The Node vitest runner (`tools/test/run-vitest-node.mjs`) is what Test (22.x) and
      # Test (24.x) run for the whole suite. These checks pin it with fixtures, before any
      # test runs: the summary and a failing item's output survive a multi-megabyte dump on
      # a pipe, its children carry a worker cap so concurrency x workers fits the runner,
      # functions is sharded on Node 22 (mixed with other packages) and unsharded-first on
      # Node 24+; the four shards partition every test file exactly once, the coverage suite
      # covers every package the plain suite covers, and prepush never reports a skipped
      # gate as passing.
      - name: Vitest runner and coverage-scope tests
        if: needs.changes.outputs.docs_only != 'true'
        run: |
          node --test tools/test/run-vitest-node.test.mjs
          node --test tools/test/run-vitest-node-workers.test.mjs
          node --test tools/test/run-vitest-node-schedule.test.mjs
          node --test tools/test/functions-shard-partition.test.mjs
          node --test tools/test/coverage-suite-scope.test.mjs
          node --test tools/test/prepush-report.test.mjs

      - name: Source map backfill tests
        if: needs.changes.outputs.docs_only != 'true'
        run: node --test tools/test/ensure-js-sourcemaps.test.mjs

      - name: Bun audit retry tests
        if: needs.changes.outputs.docs_only != 'true'
        run: node --test tools/test/bun-audit-retry.test.mjs

      - name: Apt install fallback tests
        if: needs.changes.outputs.docs_only != 'true'
        run: node --test tools/test/apt-install.test.mjs

      - name: Scratch folder tests
        if: needs.changes.outputs.docs_only != 'true'
        run: node --test tools/test/make-scratch.test.mjs

      - name: Consumer npm install argument tests
        if: needs.changes.outputs.docs_only != 'true'
        run: node --test tools/test/npm-install-args.test.mjs

      - name: A/B harness tests
        if: needs.changes.outputs.docs_only != 'true'
        run: node --test tools/test/ab-harness.test.mjs

      - name: Scalar-search harness tests
        if: needs.changes.outputs.docs_only != 'true'
        run: node --test tools/test/scalar-search-harness.test.mjs

      # docs/BENCHMARK_RESULTS.md must be the render of docs/benchmarks/wasm-public-call.json.
      - name: Benchmark results generator tests
        if: needs.changes.outputs.docs_only != 'true'
        run: node --test tools/test/gen-benchmark-results.test.mjs

      # Allocation-free fixed-size kernels (functions/src/geometry/kernels.generated.ts). The
      # generator check needs no build; the zero-allocation test imports functions/dist and
      # runs on Node with --expose-gc, so it is a direct `node` call, not a vitest file.
      - name: Fixed-size kernels generator check
        if: needs.changes.outputs.docs_only != 'true'
        run: |
          node functions/scripts/gen-kernels.mjs --check
          node --test tools/test/gen-kernels.test.mjs

      - name: Fixed-size kernels zero-allocation test
        if: needs.changes.outputs.docs_only != 'true'
        run: node --expose-gc --allow-natives-syntax --max-semi-space-size=1 tools/test/kernels-alloc.test.mjs

      # compat create() keeps its instance and prototype levels in V8 fast mode (#1200). The
      # parity-name check needs no build, the internal-name check reads functions/dist (#1216); the fast-mode test imports compat/dist and reads
      # %HasFastProperties, so it is a direct `node` call, not a vitest file.
      - name: compat parity-names generator check
        if: needs.changes.outputs.docs_only != 'true'
        run: |
          node compat/scripts/gen-parity-names.mjs --check
          node compat/scripts/gen-internal-names.mjs --check

      - name: compat fast-instance test
        if: needs.changes.outputs.docs_only != 'true'
        run: node --allow-natives-syntax tools/test/compat-fast-instance.test.mjs

      # `changeset git-tag`, which the release script runs, tags HEAD with the versions it reads
      # from the working tree, so the step order in release.yml decides which commit a release
      # tag lands on. No other job runs the script. These tests run the real script against
      # throwaway git repos with the pinned changesets CLI, and that CLI needs Node 22.11 or
      # later: this job has no pinned Node of its own, so the two steps are last, and no other
      # step sees the change.
      - name: Setup Node.js 22 (changesets CLI)
        if: needs.changes.outputs.docs_only != 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22.x

      - name: Release script tests
        if: needs.changes.outputs.docs_only != 'true'
        run: node --test tools/test/ensure-package-releases.test.mjs

      # The packaging checks below need one Node 22 (its bundled npm 10) and the development
      # dist. They ran on the Test (22.x) leg, after both full test suites, and pushed that leg
      # to its 20-minute limit (#1356). The facts they prove do not depend on the test suites.
      # `Build (production)` above rewrote dist/ with minified output, so this step puts the
      # development build back (Turbo replays it from the local cache of the Build step).
      - name: Build (development dist for the packaging checks)
        if: needs.changes.outputs.docs_only != 'true'
        run: bun run build

      - name: Public export-name lock
        if: needs.changes.outputs.docs_only != 'true'
        run: |
          node --test tools/test/check-export-lock.test.mjs
          node tools/test/check-export-lock.mjs

      # Pack every published package, install the tarballs into a fresh consumer project and
      # type-check every public entry point with skipLibCheck: false. The repo's own typecheck
      # reads source, so it cannot see errors in the emitted .d.ts (core 0.15.0 shipped six
      # TS2416 in dist/map.d.ts). Plain `node`: a `bun run` script would run it on Bun.
      # This step uses the npm 10 that Node 22 bundles, so it also proves that npm 10 users can
      # install the packed packages (no git dependencies; see check-published-deps.mjs).
      - name: Consumer type check of packed packages
        if: needs.changes.outputs.docs_only != 'true'
        run: node tools/test/consumer-typecheck.mjs --skip-build

      # The same check under moduleResolution NodeNext, which is what a Node 16+ consumer on
      # "type": "module" gets. NodeNext rejects an extensionless relative specifier in a .d.ts
      # (TS2834) and resolves bare dependencies by their CJS/ESM format, so it catches emit
      # faults that Bundler resolution accepts. Before the tsconfig.dts.base.json nodenext emit
      # it reported 60 errors (53 TS2834 + 7 TS2709); it must stay at 0.
      - name: Consumer type check of packed packages (NodeNext)
        if: needs.changes.outputs.docs_only != 'true'
        run: node tools/test/consumer-typecheck.mjs --skip-build --module-resolution=NodeNext

      - name: Packaging metadata and no-node consumer typecheck (G29)
        if: needs.changes.outputs.docs_only != 'true'
        run: |
          node tools/sync-package-packaging.mjs --check
          node tools/test/consumer-typecheck-no-node.mjs --skip-build
          node --test tools/test/packed-consumer.test.mjs

      # npm pack of every public package, the evaluate bundle sizes and the README stats check.
      # They start heavy children, so they run here and not in the vitest pool (#1185).
      - name: Packaging checks (G27, G29)
        if: needs.changes.outputs.docs_only != 'true'
        run: |
          node --test tools/test/ci-step.test.mjs
          node --test tools/test/packaging-gates.test.mjs

  # This job also runs the wall-clock perf gates (tools/test/wall-clock-gates.json) and the
  # self-test of the gates. A wall-clock verdict does not belong in the Test or Coverage jobs:
  # `bun run test` runs about 48 package processes at once, and each of them shares the two
  # cores of the runner with the gate. Here a gate runs alone, one gate at a time, and its
  # verdict comes from a noise-aware sequential rule (see tools/test/wall-clock-perf-gate.mjs).
  # The gates need the built dist of functions, matrix and compat, and one Node. This job sets
  # up Node 22 itself, so every gate and the self-test run on that Node; the Test matrix (Node
  # 20 and 22) checks correctness only. A gate that finds its noise as large as its margin
  # takes more rounds, up to `maxRounds`. When every gate decides at its first look the step
  # takes about a minute; a gate at its cap takes up to four times its first look, so the
  # worst case is a few minutes.
  benchmark-baseline:
    name: Benchmark baseline
    runs-on: ubuntu-latest
    needs: changes
    timeout-minutes: 45
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The A/B step builds the pull request base commit in a worktree, so it needs the history.
          fetch-depth: 0

      - name: Documentation-only pull request
        if: needs.changes.outputs.docs_only == 'true'
        run: |
          echo "Documentation-only changes: skipping benchmark and wall-clock gates."

      - name: Setup Bun
        if: needs.changes.outputs.docs_only != 'true'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Setup Node.js 22
        if: needs.changes.outputs.docs_only != 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22.x

      - name: Install dependencies
        if: needs.changes.outputs.docs_only != 'true'
        run: bun install --frozen-lockfile

      - name: Build functions, matrix and compat (pulls core + wasm)
        if: needs.changes.outputs.docs_only != 'true'
        run: >-
          bunx turbo build
          --filter=@danielsimonjr/mathts-functions
          --filter=@danielsimonjr/mathts-matrix
          --filter=@danielsimonjr/mathts-compat

      - name: Sprint baseline fingerprints
        if: needs.changes.outputs.docs_only != 'true'
        run: |
          node --test tools/test/sprint-baseline.test.mjs
          node tools/benchmarks/sprint-baseline.mjs --check

      # The self-test runs each gate with an injected slowdown (it must fail) and with the
      # A/A control (it must measure a ratio of about 1). It runs before the gates, so a broken
      # harness shows first.
      - name: Wall-clock perf gate tests
        if: needs.changes.outputs.docs_only != 'true'
        run: node --test tools/test/wall-clock-perf-gate.test.mjs

      # Plain `node`: under `bun run` the name `node` resolves to Bun, and a gate would time Bun.
      # The runner prints one line for each gate: the median ratio, its confidence bounds, the
      # headroom (limit / median) and the number of rounds. A gate fails early when the lower
      # bound reaches the limit. A gate that reaches its round cap with the limit still inside
      # the interval fails when its median is at or above the limit.
      - name: Wall-clock perf gates
        if: needs.changes.outputs.docs_only != 'true'
        run: node tools/test/run-wall-clock-gates.mjs

      # The gates above compare the candidate with a fixed reference implementation. Each limit
      # leaves headroom for that reference ratio, so a slowdown smaller than the headroom passes.
      # The A/B steps compare HEAD with the base commit of the pull request on the same runner,
      # with the slow limit 1.25. The README of tools/benchmark/ab records the A/A spread that
      # sets the limit. A push has no base to compare, so the steps run on pull requests only.
      # Every package is built first, because the A/B preflight refuses a stale dist. The cases
      # are the six that the README of that folder lists. `--slow-only` gates a `gain` case on
      # no slowdown. A case whose result differs bit for bit from the base fails too, unless
      # tools/benchmark/ab/allowed-output-changes.json lists the case with its pull request and
      # reason.
      - name: Build every package for the A/B
        if: needs.changes.outputs.docs_only != 'true' && github.event_name == 'pull_request'
        run: bun run build

      - name: Build the base tree
        if: needs.changes.outputs.docs_only != 'true' && github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node tools/benchmark/ab/make-base.mjs --ref "$BASE_SHA"

      - name: Base-against-head perf gate
        if: needs.changes.outputs.docs_only != 'true' && github.event_name == 'pull_request'
        run: >-
          node tools/benchmark/ab/run.mjs --slow-only --slow-limit 1.25 --engine node
          --only "median n = 100,000"
          --only "multiply 128" --only "qr 128" --only "lup 128" --only "lusolve 128×128"
          tools/benchmark/ab/cases/stats.mjs tools/benchmark/ab/cases/matmul.mjs
          tools/benchmark/ab/cases/decomp.mjs

  test:
    name: Test
    runs-on: ubuntu-latest
    # Runs in parallel with Compile & Lint: this job builds everything it needs itself.
    needs: [changes]
    timeout-minutes: 20

    strategy:
      # Independent legs so one Node version failing doesn't cancel the others.
      # Each leg runs the full suite under vitest on the matrix Node, plus a smoke test of
      # the built dist, by calling `node` directly (a `bun run` script would put them back
      # on Bun). The Bun-runtime suite (`bun run test`) runs every package script on Bun
      # ([run] bun = true), so the matrix Node does not change it: it runs once, in the
      # Coverage job. The packaging checks run once, in the Compile & Lint job (#1356).
      fail-fast: false
      matrix:
        # Every package declares engines.node ">=22.12": Node 20 reached EOL 2026-04 and
        # 22.12 is the first 22 release where require() of an ES module works unflagged.
        node-version: [22.x, 24.x]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Documentation-only pull request (Test 24.x)
        if: needs.changes.outputs.docs_only == 'true' && matrix.node-version != '22.x'
        run: |
          echo "Documentation-only changes: vitest and doc gates run on Test (22.x) only."

      - name: Setup Bun
        if: needs.changes.outputs.docs_only != 'true' || matrix.node-version == '22.x'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Check Bun matches the packageManager pin
        if: needs.changes.outputs.docs_only != 'true'
        run: node tools/test/check-bun-version.mjs

      - name: Setup Node.js ${{ matrix.node-version }}
        if: needs.changes.outputs.docs_only != 'true' || matrix.node-version == '22.x'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        if: needs.changes.outputs.docs_only != 'true' || matrix.node-version == '22.x'
        run: bun install --frozen-lockfile

      # npm 10 (bundled with Node 22) cannot install a package that has a git
      # dependency, so every published manifest must use registry specs only.
      - name: Published manifests use registry dependencies only
        if: needs.changes.outputs.docs_only != 'true'
        run: node tools/test/check-published-deps.mjs

      # `bun run build` compiles the AssemblyScript wasm itself: turbo.json orders
      # matrix#build and functions#build after @danielsimonjr/mathts-wasm#build, and their
      # copy-wasm.mjs steps fail when the binary is missing. (A separate `build:wasm` step
      # used to paper over a race between that copy and `asc`.)
      - name: Build
        if: needs.changes.outputs.docs_only != 'true' || matrix.node-version == '22.x'
        run: bun run build

      # Markdown and README samples are not inert: run the pinned docs gate subset.
      - name: Documentation gates (docs-only pull requests)
        if: needs.changes.outputs.docs_only == 'true' && matrix.node-version == '22.x'
        run: node tools/ci/run-docs-only-tests.mjs

      # Every package's tests under vitest on the matrix Node, plus the root suites
      # and the assembly Node test scripts. Prints a `[runtime-probe]` line.
      - name: Test on Node ${{ matrix.node-version }} (vitest)
        if: needs.changes.outputs.docs_only != 'true'
        run: node tools/test/run-vitest-node.mjs

      # Import each published package by name (Node resolves its `exports`) and call
      # one representative function from the built dist.
      - name: Smoke test dist on Node ${{ matrix.node-version }}
        if: needs.changes.outputs.docs_only != 'true'
        run: node tools/test/smoke-dist-node.mjs

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    # Runs in parallel with Compile & Lint: this job builds everything it needs itself.
    needs: [changes]
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Documentation-only pull request
        if: needs.changes.outputs.docs_only == 'true'
        run: |
          echo "Documentation-only changes: skipping coverage suite."

      - name: Setup Bun
        if: needs.changes.outputs.docs_only != 'true'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Check Bun matches the packageManager pin
        if: needs.changes.outputs.docs_only != 'true'
        run: node tools/test/check-bun-version.mjs

      - name: Install dependencies
        if: needs.changes.outputs.docs_only != 'true'
        run: bun install --frozen-lockfile

      # `bun run build` compiles the AssemblyScript wasm itself: turbo.json orders
      # matrix#build and functions#build after @danielsimonjr/mathts-wasm#build, and their
      # copy-wasm.mjs steps fail when the binary is missing. (A separate `build:wasm` step
      # used to paper over a race between that copy and `asc`.)
      - name: Build
        if: needs.changes.outputs.docs_only != 'true'
        run: bun run build

      # The Bun-runtime suite, ONCE: `bun run test:coverage` runs every package's suite
      # with coverage and then the root vitest suites, so the same suite that the
      # skip-budget parser reads is the one that produces the coverage reports (the suite
      # used to run twice here — once plain for the parser's log, once with coverage).
      # Every package script runs on Bun ([run] bun = true), so the result does not depend
      # on a Node version. Node 22 is set up so that a tool that starts real Node sees the
      # runtime that the former Test (22.x) run of this step saw.
      - name: Setup Node.js 22
        if: needs.changes.outputs.docs_only != 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22.x

      # `shell: bash` makes GitHub run this with `-eo pipefail`, so `tee` cannot mask a failure.
      # TURBO_CONCURRENCY=2: ubuntu-latest (26.04) once aborted this job with SIGABRT /
      # "Out of memory" (exit 137) when Turbo ran every package's coverage task at once.
      - name: Test with coverage (Bun runtime, single run)
        if: needs.changes.outputs.docs_only != 'true'
        shell: bash
        run: bun run test:coverage 2>&1 | tee test-output.log
        env:
          TURBO_CONCURRENCY: '2'

      # Skipped tests pass silently: nine WASM-tier suites once skipped themselves on
      # every machine for months. Each suite's skip count is pinned in
      # tools/test/skip-baseline.json and any change, up or down, fails here. The parser
      # reads the `test:coverage` tasks of the single run above (and still accepts a plain
      # `bun run test` log): its own tests run first.
      - name: Skip budget
        if: needs.changes.outputs.docs_only != 'true'
        run: |
          node --test tools/test/check-skip-budget.test.mjs
          node tools/test/check-skip-budget.mjs test-output.log

      - name: Per-package coverage floors
        if: needs.changes.outputs.docs_only != 'true'
        run: |
          node --test tools/test/check-coverage-floors.test.mjs
          node tools/test/check-coverage-floors.mjs

      - name: Upload coverage to Codecov
        if: needs.changes.outputs.docs_only != 'true'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  browser:
    name: Browser (WebGPU smoke)
    # Noble package list in playwright-chromium-apt-packages.mjs; ubuntu-latest may be >24.04.
    runs-on: ubuntu-24.04
    # Runs in parallel with Compile & Lint: this job builds everything it needs itself.
    needs: [changes]
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Documentation-only pull request
        if: needs.changes.outputs.docs_only == 'true'
        run: |
          echo "Documentation-only changes: skipping browser smoke tests."

      - name: Setup Bun
        if: needs.changes.outputs.docs_only != 'true'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Check Bun matches the packageManager pin
        if: needs.changes.outputs.docs_only != 'true'
        run: node tools/test/check-bun-version.mjs

      - name: Install Mesa lavapipe (software Vulkan adapter for WebGPU)
        if: needs.changes.outputs.docs_only != 'true'
        run: sudo bash tools/ci/apt-install.sh install mesa-vulkan-drivers libegl1

      - name: Install dependencies
        if: needs.changes.outputs.docs_only != 'true'
        run: bun install --frozen-lockfile

      - name: Install Playwright OS dependencies
        if: needs.changes.outputs.docs_only != 'true'
        run: |
          pkg_file=$(mktemp)
          node tools/ci/playwright-chromium-apt-packages.mjs >"$pkg_file"
          mapfile -t pw_pkgs <"$pkg_file"
          rm -f "$pkg_file"
          sudo bash tools/ci/apt-install.sh install "${pw_pkgs[@]}"

      - name: Install Playwright browsers
        if: needs.changes.outputs.docs_only != 'true'
        run: bunx --bun playwright install chromium

      # `bun run build` compiles the AssemblyScript wasm itself: turbo.json orders
      # matrix#build and functions#build after @danielsimonjr/mathts-wasm#build, and their
      # copy-wasm.mjs steps fail when the binary is missing. (A separate `build:wasm` step
      # used to paper over a race between that copy and `asc`.)
      - name: Build (required for workspace package resolution)
        if: needs.changes.outputs.docs_only != 'true'
        run: bun run build

      - name: Browser smoke tests (WebGPU)
        if: needs.changes.outputs.docs_only != 'true'
        run: bun run test:browser
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          GALLIUM_DRIVER: llvmpipe

  architecture-docs:
    name: Architecture docs
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      # The tool version and the documents folder live here and nowhere else in the job. The
      # version is exact. A new release of repo-tools can change how it counts and turn this job
      # red with no change to the code, so raise the pin on purpose, after a local run of the check.
      REPO_TOOLS_VERSION: 2.2.4
      ARCHITECTURE_DOCS_DIR: docs/Architecture

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # repo-tools needs Node 22 or later. The check parses the source files and reads the
      # documents, so this job needs no Bun, no install of the workspace and no build.
      - name: Setup Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22.x

      - name: Install repo-tools
        run: npm install --global "@danielsimonjr/repo-tools@${REPO_TOOLS_VERSION}"

      # Each architecture document ends with a Verification table of counts that the parse of the
      # source gives. The check exits 1 when a document claims a count that the parse does not
      # give. Without this job, a change that moves a count leaves the tables stale until a person
      # runs the command.
      - name: Architecture documents match the code
        run: repo-tools check . --docs="${ARCHITECTURE_DOCS_DIR}"

      # repo-tools finds no MUST doc-comment issue in the tracked source files of the whole
      # repository. The script checks the repository that holds it, with the exclusions in
      # .code-docs.json. The test pins that the gate can fail.
      - name: Code doc comments
        run: |
          node --test tools/test/check-code-docs.test.mjs
          node tools/test/check-code-docs.mjs
