name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  # A branch pushed by a bot with GITHUB_TOKEN does not fire `push` or
  # `pull_request` -- GitHub's recursion guard suppresses it. That is how the
  # Changesets release PR (`changeset-release/main`) reached BLOCKED with zero
  # runs and all five required contexts missing: nothing was ever going to run
  # them. These two triggers make the branch gaugeable by a human on demand and
  # exercise `main` nightly regardless of who pushed to it.
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: this workflow never pushes commits or opens PRs.
permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: '1'

jobs:
  compile:
    name: Compile & Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Bun is the monorepo package manager and, with bunfig [run].bun = true, the
      # runtime of every `bun run` script (vitest, asc, tsc, tsdown, turbo included).
      # Every step of this job runs through Bun, except the last two, which run the release
      # script tests on Node 22 (see below). The Test matrix installs Node to run the suite
      # and a dist smoke test on real Node (see `test`).
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Check Bun matches the packageManager pin
        run: node tools/test/check-bun-version.mjs

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # `typecheck` reads `dist/` of the package it checks and of the packages its tests
      # compile. A missing Turbo edge lets that package's `build` clean `dist/` mid-run.
      # The check reads the resolved task graph, so it needs no build.
      - name: Typecheck task graph
        run: |
          node --test tools/test/check-typecheck-graph.test.mjs
          node tools/test/check-typecheck-graph.mjs

      # `bun run build` compiles the AssemblyScript wasm itself: turbo.json orders
      # matrix#build and functions#build after @danielsimonjr/mathts-wasm#build, and their
      # copy-wasm.mjs steps fail when the binary is missing. (A separate `build:wasm` step
      # used to paper over a race between that copy and `asc`.)
      - name: Build
        run: bun run build

      - name: Type check
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      # Guard: the pre-commit hook formats only staged files, so drift
      # accumulated unseen until this check ran nowhere. Keep it in CI.
      - name: Format check
        run: bun run format:check

      - name: Docs export-index drift check
        run: bun run docs:functions:check

      # The four node:test files of the dependency-graph generator. Nothing else ran them, so
      # a generator edit could break the reports (or their stable order) with every check green.
      - name: Dependency-graph generator tests
        run: bun run docs:deps:test

      - name: Browser-safety (no node leaks from browser entries)
        run: bun run check:browser-safety

      - name: Bundle size and tree-shake record
        run: |
          node --test tools/test/check-bundle-budget.test.mjs
          node tools/test/check-bundle-budget.mjs

      # The step above is the development build (`build`: unminified). `build:prod` adds
      # --minify --treeshake and nothing else built it, so a failure there was invisible until
      # someone ran it by hand. It runs last because it rewrites dist/ with minified output.
      - name: Build (production)
        run: bun run build:prod

      - name: Audit (high+)
        # Bun audit covers the bun.lock tree. Same high+ floor as the old
        # `npm audit --audit-level=high` gate. The tree currently audits clean at
        # every level (`bun audit` with no floor reports 0). Retries registry outages only
        # (`tools/test/bun-audit-retry.mjs`); a real high+ advisory still fails on first try.
        run: node tools/test/bun-audit-retry.mjs

      # Tool tests that no workflow used to run. `check:browser-safety` is the query
      # tool's `--check-browser-safety` mode, `docs:roadmap-check` is the roadmap checker,
      # the scanner that `smoke-dist-node.mjs` uses to find a Node builtin in a built browser
      # entry is tested without a build, and the docs dist-freshness preflight uses its own
      # fixtures. The first two run under `bun test` through their root scripts. The last three
      # are direct `node --test`, as the other `tools/test` files are. They sit just before
      # the Node 22 setup below, so none of them sees that Node.
      - name: Dependency-graph query tests
        run: bun run docs:graph:test

      - name: Roadmap check tests
        run: bun run docs:roadmap-check:test

      - name: Dist builtin scanner tests
        run: node --test tools/test/dist-node-imports.test.mjs

      - name: Docs dist-freshness tests
        run: node --test tools/test/dist-freshness.test.mjs

      - name: Bun audit retry tests
        run: node --test tools/test/bun-audit-retry.test.mjs

      # `changeset git-tag`, which the release script runs, tags HEAD with the versions it reads
      # from the working tree, so the step order in release.yml decides which commit a release
      # tag lands on. No other job runs the script. These tests run the real script against
      # throwaway git repos with the pinned changesets CLI, and that CLI needs Node 22.11 or
      # later: this job has no pinned Node of its own, so the two steps are last, and no other
      # step sees the change.
      - name: Setup Node.js 22 (changesets CLI)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22.x

      - name: Release script tests
        run: node --test tools/test/ensure-package-releases.test.mjs

  benchmark-baseline:
    name: Benchmark baseline
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build functions (pulls core + wasm)
        run: bunx turbo build --filter=@danielsimonjr/mathts-functions

      - name: Sprint baseline fingerprints
        run: node tools/benchmarks/sprint-baseline.mjs --check

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: compile
    timeout-minutes: 20

    strategy:
      # Independent legs so one Node version failing doesn't cancel the others.
      # `bun run test` runs every package script on BUN ([run] bun = true), so it
      # proves nothing about Node. Each leg therefore ALSO runs the full suite under
      # vitest on the matrix Node, plus a smoke test of the built dist, by calling
      # `node` directly (a `bun run` script would put them back on Bun).
      fail-fast: false
      matrix:
        # Node 18 reached EOL 2026-04 and the toolchain uses Node 20+ APIs
        # (e.g. util.styleText), so 18.x is no longer supported/tested.
        node-version: [20.x, 22.x]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Check Bun matches the packageManager pin
        run: node tools/test/check-bun-version.mjs

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # npm 10 (bundled with Node 20 and 22) cannot install a package that has a git
      # dependency, so every published manifest must use registry specs only.
      - name: Published manifests use registry dependencies only
        run: node tools/test/check-published-deps.mjs

      # `bun run build` compiles the AssemblyScript wasm itself: turbo.json orders
      # matrix#build and functions#build after @danielsimonjr/mathts-wasm#build, and their
      # copy-wasm.mjs steps fail when the binary is missing. (A separate `build:wasm` step
      # used to paper over a race between that copy and `asc`.)
      - name: Build
        run: bun run build

      - name: Public export-name lock
        if: matrix.node-version == '22.x'
        run: |
          node --test tools/test/check-export-lock.test.mjs
          node tools/test/check-export-lock.mjs

      # `shell: bash` makes GitHub run this with `-eo pipefail`, so `tee` cannot mask a failure.
      - name: Test (Bun runtime)
        shell: bash
        run: bun run test 2>&1 | tee test-output.log

      # Skipped tests pass silently: nine WASM-tier suites once skipped themselves on
      # every machine for months. Each suite's skip count is pinned in
      # tools/test/skip-baseline.json and any change, up or down, fails here. The parser's
      # own tests run first: Turbo formats its output differently here than in a terminal.
      - name: Skip budget
        run: |
          node --test tools/test/check-skip-budget.test.mjs
          node tools/test/check-skip-budget.mjs test-output.log

      # Every package's tests under vitest on the matrix Node, plus the root suites
      # and the assembly Node test scripts. Prints a `[runtime-probe]` line.
      - name: Test on Node ${{ matrix.node-version }} (vitest)
        run: node tools/test/run-vitest-node.mjs

      # Import each published package by name (Node resolves its `exports`) and call
      # one representative function from the built dist.
      - name: Smoke test dist on Node ${{ matrix.node-version }}
        run: node tools/test/smoke-dist-node.mjs

      # Pack every published package, install the tarballs into a fresh consumer project and
      # type-check every public entry point with skipLibCheck: false. The repo's own typecheck
      # reads source, so it cannot see errors in the emitted .d.ts (core 0.15.0 shipped six
      # TS2416 in dist/map.d.ts). Plain `node`: a `bun run` script would run it on Bun.
      # This step uses the npm 10 that Node 22 bundles, so it also proves that npm 10 users can
      # install the packed packages (no git dependencies; see check-published-deps.mjs).
      - name: Consumer type check of packed packages
        if: matrix.node-version == '22.x'
        run: node tools/test/consumer-typecheck.mjs --skip-build

      # The same check under moduleResolution NodeNext, which is what a Node 16+ consumer on
      # "type": "module" gets. NodeNext rejects an extensionless relative specifier in a .d.ts
      # (TS2834) and resolves bare dependencies by their CJS/ESM format, so it catches emit
      # faults that Bundler resolution accepts. Before the tsconfig.dts.base.json nodenext emit
      # it reported 60 errors (53 TS2834 + 7 TS2709); it must stay at 0.
      - name: Consumer type check of packed packages (NodeNext)
        if: matrix.node-version == '22.x'
        run: node tools/test/consumer-typecheck.mjs --skip-build --module-resolution=NodeNext

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    needs: compile
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Check Bun matches the packageManager pin
        run: node tools/test/check-bun-version.mjs

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # `bun run build` compiles the AssemblyScript wasm itself: turbo.json orders
      # matrix#build and functions#build after @danielsimonjr/mathts-wasm#build, and their
      # copy-wasm.mjs steps fail when the binary is missing. (A separate `build:wasm` step
      # used to paper over a race between that copy and `asc`.)
      - name: Build
        run: bun run build

      - name: Test with coverage
        run: bun run test:coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  browser:
    name: Browser (WebGPU smoke)
    runs-on: ubuntu-latest
    needs: compile
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Check Bun matches the packageManager pin
        run: node tools/test/check-bun-version.mjs

      - name: Install Mesa lavapipe (software Vulkan adapter for WebGPU)
        run: |
          sudo apt-get update -y
          sudo apt-get install -y mesa-vulkan-drivers libegl1

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright browsers
        run: bunx --bun playwright install chromium --with-deps

      # `bun run build` compiles the AssemblyScript wasm itself: turbo.json orders
      # matrix#build and functions#build after @danielsimonjr/mathts-wasm#build, and their
      # copy-wasm.mjs steps fail when the binary is missing. (A separate `build:wasm` step
      # used to paper over a race between that copy and `asc`.)
      - name: Build (required for workspace package resolution)
        run: bun run build

      - name: Browser smoke tests (WebGPU)
        run: bun run test:browser
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          GALLIUM_DRIVER: llvmpipe

  architecture-docs:
    name: Architecture docs
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      # The tool version and the documents folder live here and nowhere else in the job. The
      # version is exact. A new release of repo-tools can change how it counts and turn this job
      # red with no change to the code, so raise the pin on purpose, after a local run of the check.
      REPO_TOOLS_VERSION: 2.2.4
      ARCHITECTURE_DOCS_DIR: docs/Architecture

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # repo-tools needs Node 20 or later. The check parses the source files and reads the
      # documents, so this job needs no Bun, no install of the workspace and no build.
      - name: Setup Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22.x

      - name: Install repo-tools
        run: npm install --global "@danielsimonjr/repo-tools@${REPO_TOOLS_VERSION}"

      # Each architecture document ends with a Verification table of counts that the parse of the
      # source gives. The check exits 1 when a document claims a count that the parse does not
      # give. Without this job, a change that moves a count leaves the tables stale until a person
      # runs the command.
      - name: Architecture documents match the code
        run: repo-tools check . --docs="${ARCHITECTURE_DOCS_DIR}"
