      ### Interval Arithmetic

      Rigorous interval arithmetic with outward rounding — a verified-bounds numeric
      type (the `mpmath.iv` / INTLAB analogue), distinct from every other function
      in this table in that its guarantee is over _containment_, not a single
      floating-point value.

      | Function           | Description                                             |
      | ------------------ | ------------------------------------------------------- |
      | `interval(lo, hi)` | Construct an `Interval` `[lo, hi]`; throws if `lo > hi` |

      `Interval` instance methods (fluent):

      | Method         | Description                                                                                 |
      | -------------- | ------------------------------------------------------------------------------------------- |
      | `.add(b)`      | `[lo+b.lo, hi+b.hi]`, outward-rounded                                                       |
      | `.sub(b)`      | `[lo-b.hi, hi-b.lo]`, outward-rounded                                                       |
      | `.mul(b)`      | `[min, max]` of all four endpoint products, outward-rounded                                 |
      | `.div(b)`      | `[min, max]` of all four endpoint quotients, outward-rounded; throws if `b` contains `0`    |
      | `.neg()`       | `[-hi, -lo]`, outward-rounded                                                               |
      | `.width()`     | `hi - lo`                                                                                   |
      | `.mid()`       | `(lo + hi) / 2`                                                                             |
      | `.contains(x)` | Whether the closed interval contains the real number `x`                                    |
      | `.sqrt()`      | Monotonic square root; throws if the interval contains negative values                      |
      | `.exp()`       | Monotonic exponential                                                                       |
      | `.log()`       | Monotonic natural log; throws if the interval is not strictly positive                      |
      | `.pow(n)`      | Integer power, monotonic-aware (even powers over an interval spanning `0` have minimum `0`) |

      - **Outward rounding.** JavaScript has no access to IEEE-754 directed
        rounding modes, so as a practical surrogate every result's `lo` is nudged
        down and `hi` nudged up by a tiny relative epsilon
        (`lo - |lo|*Number.EPSILON - Number.MIN_VALUE`,
        `hi + |hi|*Number.EPSILON + Number.MIN_VALUE`) after each operation. This
        guarantees the true real-valued result of any op on points drawn from the
        operand intervals lies inside the returned interval.
      - Example: `interval(1, 2).add(interval(3, 4))` = `[4, 6]`;
        `interval(-1, 2).mul(interval(2, 3))` = `[-3, 6]`;
        `interval(1, 4).sqrt()` = `[1, 2]`.

      ### Details

      - `findRoot` requires a sign change across the bracket `[a, b]`; it combines the
        guaranteed convergence of bisection with the speed of Brent's method.
      - `newton`, `secant`, and `halley` are **open** (non-bracketing) root-finders —
        they iterate from a starting point (or two, for `secant`) instead of a
        sign-changing bracket, and can diverge if the guess is poor. `newton` and
        `halley` accept an optional analytic derivative (`fprime`/`fprime2`); when
        omitted, a central-difference estimate is used. All three default to
        `tol = 1e-12`, `maxIter = 100`, and throw on non-convergence or a
        (near-)zero denominator/derivative.
      - `fsolve` (alias `root`) solves a **nonlinear system** `F(x) = 0` for
        `F: ℝⁿ → ℝⁿ`, not a single scalar equation: at each iterate it builds
        `J = numericJacobian(F, x)`, solves the Newton step `J·Δ = −F(x)` via
        `linsolve`, then backtracks (`λ = 1, 1/2, 1/4, …`, up to ~20 halvings) to
        the largest `λ` for which `‖F(x + λΔ)‖₂` improves, falling back to a full
        Newton step (`λ = 1`) if no halving helps. Converges when
        `max_i |F_i(x)| < tol` (default `tol = 1e-10`, `maxIter = 100`); throws on a
        singular Jacobian or non-convergence.
      - `minimize` / `maximize` find a **local** optimum near the starting point
        `x0`; `globalMinimize` searches a bounded region for a global optimum.
      - `minimizeScalar` is a 1-D-only minimizer — distinct from root-finding — for
        `f: ℝ → ℝ` over a bounded interval (`opts.bracket`, default `[-10, 10]`);
        Brent's method falls back to golden-section steps when the points aren't
        distinct enough for a reliable parabolic fit, giving guaranteed convergence
        with superlinear speed near a smooth minimum.
      - `linprog` and `quadprog` solve constrained linear and quadratic programs.
        `linprog`'s legacy positional form `linprog(c, A_ub, b_ub)` (`Ax <= b, x >= 0`)
        is unchanged; an additive options form `linprog(c, { A_ub, b_ub, A_eq, b_eq,
      bounds })` runs a two-phase simplex (Phase 1 artificial variables find a
        basic feasible solution, Phase 2 optimizes) that also handles equality
        constraints, per-variable `bounds` (default `[0, null]`), and reports
        `{ x, fun, success, status }` with `status` one of `'optimal'`,
        `'infeasible'`, or `'unbounded'`.
      - The ODE family ranges from fixed-step (`solveODE`) through adaptive
        (`odeAdaptiveStep`) to `stiffODESolver` for stiff systems where explicit
        methods would require impractically small steps.
      - `cond(A)` reports how sensitive a linear solve is to perturbations — a large
        condition number warns that `linsolve` results may be unreliable.

      ### Background & History

      Newton's method (Isaac Newton, 1669; refined by Joseph Raphson) and the
      bisection method are the classic root-finders; Richard Brent's 1973 algorithm
      combines bracketing safety with superlinear speed and is the modern default.
      The Runge–Kutta family for ODEs was developed by Carl Runge and Wilhelm Kutta
      around 1900. Optimisation has a sharper birthday: George Dantzig invented the
      simplex method for linear programming in 1947, and interior-point methods
      followed in the 1980s, opening up large-scale quadratic and convex programming.

      ### Examples

      ```typescript
      import {
        findRoot,
        newton,
        secant,
        halley,
        fsolve,
        minimize,
        minimizeScalar,
        leastSquares,
      } from '@danielsimonjr/mathts-functions';

      findRoot((x) => x ** 3 - x - 2, 1, 2); // ~1.5214
      newton((x) => x * x - 2, 1); // ~1.4142135623730951
      secant((x) => x * x - 2, 1, 2); // ~1.4142135623730951
      halley((x) => x ** 3 - 2, 1); // ~1.2599210498948732
      fsolve((v) => [v[0] ** 2 - v[1], v[0] + v[1] - 2], [0.5, 0.5]); // ~[1, 1]
      minimize((x) => (x - 3) ** 2, 0); // ~3.0
      minimizeScalar((x) => (x - 2) ** 2, { bracket: [-5, 5] }); // { x: ~2, fval: ~0 }
      leastSquares(
        [
          [1, 0],
          [1, 1],
          [1, 2],
        ],
        [1, 2, 3]
      ); // [1, 1]
      ```

      ## Signal Processing

      Every `parallel*` transform dispatches its FFT work to worker threads and
      returns a `Promise`: `parallelFFT` / `parallelIFFT` decompose a single large
      transform via the four-step (transpose) algorithm into two batches of
      independent smaller FFTs; `parallelFFTMagnitude` / `parallelFFTPower`
      parallelize the element-wise spectra; `parallelConv` / `parallelXCorr` /
      `parallelAutoCorr` run the two forward FFTs concurrently. `spectrogram` and
      `fft2d` likewise dispatch their batches of independent FFTs. Small inputs fall
      back to the sequential radix-2 implementation on the calling thread.

      | `firls(numtaps, bands, desired)`     | Least-squares linear-phase FIR design: `bands` is a flat `[lo, hi, lo, hi, …]` list of band-edge pairs (Nyquist-normalized) with `desired` the response at those edges (linearly interpolated within each band; gaps between bands are unconstrained transition regions) — `scipy.signal.firls`. A genuine (non-approximate) least-squares fit — dense trapezoid-quadrature sampling of the bands plus a cosine-basis normal-equations solve — not bit-pinned against scipy's exact closed-form integrals |
      | `remez(numtaps, bands, desired)`     | Parks-McClellan-style equiripple FIR design — **approximate**: implements Lawson's algorithm (iteratively reweighted least squares over the `firls` normal equations, reweighting toward the largest per-iteration error) rather than the exact Remez-exchange algorithm; converges toward but does not guarantee a true minimax/equiripple solution                                                                                                                                                      |
      | `savgol(x, windowLength, polyorder)` | Savitzky-Golay smoothing: fits a degree-`polyorder` polynomial (normal equations over a Vandermonde of window offsets) to each `windowLength`-point window and takes the center value; edges reuse the nearest boundary window's fit evaluated at the edge point's offset (scipy's `mode='interp'`) — exact on polynomials of degree <= `polyorder`; pinned bit-for-bit against `scipy.signal.savgol_filter`                                                                                              |
      | `wiener(x[, mysize])`                | Wiener adaptive filter: local mean `m`/variance `v` over a `mysize`-window (same-length, zero-padded edges), noise `= mean(v)`; output `m + max(0, v−noise)/max(v, noise)·(x−m)`                                                                                                                                                                                                                                                                                                                          |
      | `deconvolve(signal, divisor)`        | FIR/polynomial deconvolution via synthetic long division: `signal = conv(divisor, quotient) + remainder`, `quotient` length `signal.length − divisor.length + 1` — `scipy.signal.deconvolve`; pinned bit-for-bit including the non-exact-division remainder case                                                                                                                                                                                                                                          |

      ### Details

      - The `parallel`-marked transforms return a `Promise` and dispatch their FFT
        work to the worker pool above the parallel threshold: `parallelFFT` /
        `parallelIFFT` use a four-step decomposition that splits one transform into
        two batches of independent smaller FFTs; `parallelFFTMagnitude` /
        `parallelFFTPower` parallelize the element-wise spectrum pass; `parallelConv`
        / `parallelXCorr` / `parallelAutoCorr` run the two forward FFTs concurrently;
        `spectrogram` and `fft2d` dispatch their batches of independent FFTs. Below
        the threshold all of them fall back to the sequential radix-2 core.
        `parallelIFFT`, `spectrogram`, and `fft2d` became `async` for this.
      - FFT routines are fastest at power-of-two lengths; other lengths use a
        mixed-radix path.
      - WASM-marked transforms (`dct`, `dwt`, `spectrogram`, the FIR filters, …) use a
        WebAssembly kernel for inputs above an internal size threshold and fall back
        to the TypeScript implementation otherwise.
      - Apply a `windowFunction` (Hamming, Hann, Blackman, …) before an FFT to reduce
        spectral leakage from finite-length signals.
      - `spectrogram` gives a time–frequency picture; `periodogram` estimates the
        power spectral density.
      - `unwrapPhase` removes the artificial 2π jumps that appear when phase is
        computed with `atan2`.
      - `dwt`/`idwt`/`wavedec`/`waverec` support 9 orthogonal wavelet families —
        `haar`, `db1`-`db4`, `sym2`-`sym4`, `coif1`-`coif2` — via a general filter
        bank with **periodization** boundary handling, matching
        `pywt.dwt(..., mode='periodization')` bit-for-bit (PyWavelets 1.8.0
        oracle). `haar`/`db1` additionally get a dedicated WASM-accelerated 2-tap
        fast path above an internal size threshold; the general path is otherwise
        pure TypeScript. `idwt` inverts a single level of `dwt` exactly; `wavedec`/
        `waverec` repeat `dwt`/`idwt` across levels (`[cA_level, cD_level, …,
      cD_1]`, pywt order) for perfect reconstruction —
        `waverec(wavedec(x, w, L), w) === x` for every supported family. `cwt`
        (unchanged) convolves the signal with a discretized, normalized Ricker
        (Mexican-hat) or Morlet wavelet at each scale.

      ### Background & History

      The Fourier transform — the decomposition of a signal into its constituent
      frequencies — comes from Joseph Fourier's 1822 study of heat conduction. For
      over a century it was a theoretical tool; the breakthrough was the
      **Fast Fourier Transform** of James Cooley and John Tukey (1965), which cut the
      cost of an N-point transform from O(N²) to O(N log N). (Gauss had in fact
      discovered an equivalent algorithm in 1805, unpublished.) The FFT is now one of
      the most-used algorithms in existence — the engine behind digital audio, image
      compression, wireless communication, and spectral analysis.

      ### Examples

      ```typescript
      import { parallelFFT, parallelConv, windowFunction } from '@danielsimonjr/mathts-functions';

      const signal = new Float64Array(1024).map((_, i) => Math.sin((2 * Math.PI * i) / 64));
      const spectrum = await parallelFFT(signal);
      const filtered = await parallelConv(signal, new Float64Array([0.25, 0.5, 0.25]));
      ```

      ### Details

      - Points and vectors are plain coordinate arrays; most functions have explicit
        2D, 3D, and nD variants.
      - `polygonArea` uses the shoelace formula and returns a signed area whose sign
        encodes vertex orientation (counter-clockwise positive).
      - `convexHull` is computed by Graham scan; `delaunayTriangulation` and
        `voronoiDiagram` are geometric duals of one another.
      - Build a `kdTree` once and reuse it for many `kdTreeNearest` queries — far
        faster than repeated linear `nearestNeighbor` scans.
      - The distance family covers the L1 (`manhattanDistance`), L2 (`distance*`),
        L∞ (`chebyshevDistance`), and general Lp (`minkowskiDistance`) metrics.

      ### Background & History

      Computational geometry emerged as a distinct field in the 1970s, though its
      formulas are older — the shoelace formula for polygon area is attributed to
      Gauss. The Voronoi diagram, which partitions a plane into cells nearest each
      site, was formalised by Georgy Voronoy in 1908; its dual, the Delaunay
      triangulation, came from Boris Delaunay in 1934. These structures are now
      indispensable in mesh generation, geographic information systems, computer
      graphics, and scattered-data interpolation.

        [0, 0],
        [1, 0],
        [0, 1],
        [1, 1],
        [0.5, 0.5],
      ]); // [[0,0],[1,0],[1,1],[0,1]]

      ## Graph Theory

      Algorithms over adjacency-matrix representations.

      | Function                                | Description                                                                                                           |
      | --------------------------------------- | --------------------------------------------------------------------------------------------------------------------- |
      | `adjacencyMatrix(edges, n[, directed])` | Build adjacency matrix from an edge list (`directed=true` keeps `[u,v]` one-directional; default `false` symmetrizes) |
      | `shortestPath(adj, start, end)`         | Dijkstra shortest path (node sequence)                                                                                |
      | `graphDistance(adj, start, end)`        | Shortest-path length                                                                                                  |
      | `minimumSpanningTree(adj)`              | MST (Prim) → edge list                                                                                                |
      | `connectedComponents(adj)`              | Connected components                                                                                                  |
      | `stronglyConnectedComponents(adj)`      | SCCs (Kosaraju)                                                                                                       |
      | `topologicalSort(adj)`                  | Topological order (DAGs)                                                                                              |
      | `isConnected(adj)`                      | Connectivity test                                                                                                     |
      | `pageRank(adj[, opts])`                 | PageRank centrality (power iteration; `dampingFactor` default 0.85) — `async`                                         |
      | `betweennessCentrality(adj[, opts])`    | Brandes betweenness centrality — `async`                                                                              |
      | `eigenvectorCentrality(adj[, opts])`    | Power-iteration eigenvector centrality — `async`                                                                      |
      | `bfs(adj, start)`                       | Breadth-first traversal order (ascending-index neighbor visitation)                                                   |
      | `dfs(adj, start)`                       | Depth-first traversal order (ascending-index neighbor visitation)                                                     |
      | `floydWarshall(adj)`                    | All-pairs shortest-path distances (negative weights okay)                                                             |
      | `bellmanFord(adj, source)`              | Single-source shortest paths + negative-cycle detection                                                               |
      | `closenessCentrality(adj)`              | Distance-based closeness centrality (networkx convention)                                                             |
      | `harmonicCentrality(adj)`               | Distance-based harmonic centrality (networkx convention)                                                              |
      | `maxFlow(capacity, source, sink)`       | Maximum flow (Edmonds-Karp) → `{ maxFlow, flow }`                                                                     |
      | `minCut(capacity, source, sink)`        | Minimum s-t cut via max-flow-min-cut → `{ value, partition: [S, T] }`                                                 |
      | `astar(adj, start, goal, heuristic)`    | A\* heuristic shortest path → `{ path, cost }` (reduces to Dijkstra at h=0)                                           |
      | `hungarian(cost)`                       | Kuhn-Munkres optimal assignment (minimize) → `{ assignment, cost }`                                                   |
      | `graphColoring(adj)`                    | Greedy proper vertex coloring (Welsh-Powell heuristic) → color index per vertex                                       |
      | `maxClique(adj)`                        | Maximum clique via Bron-Kerbosch with pivoting → vertex set                                                           |
      | `louvainCommunities(adj)`               | Louvain modularity community detection → partition (array of vertex groups)                                           |
      | `katzCentrality(adj, alpha[, beta])`    | Katz centrality (L2-normalized) — `networkx.katz_centrality_numpy` convention                                         |
      | `isIsomorphic(graphA, graphB)`          | Graph isomorphism test (backtracking + degree-sequence pruning)                                                       |

      ### Details

      - Graphs are represented by an adjacency matrix; build one from an edge list
        with `adjacencyMatrix(edges, n[, directed])`. `directed` (default `false`)
        controls whether an edge `[u, v]` is written to both `adj[u][v]` and
        `adj[v][u]` (undirected) or only `adj[u][v]` (directed, asymmetric matrix).
      - `shortestPath` uses Dijkstra's algorithm and returns the node sequence;
        `graphDistance` returns only the total path length.
      - `topologicalSort` is defined for directed acyclic graphs — a cycle makes a
        topological order impossible.
      - `stronglyConnectedComponents` (Kosaraju's algorithm) applies to directed
        graphs; `connectedComponents` to undirected ones.
      - `bfs`/`dfs` treat any finite, nonzero off-diagonal `adj[i][j]` as a directed
        edge i → j (visited in ascending neighbor-index order); the graph is read
        as directed and never symmetrized.
      - `floydWarshall` computes all-pairs distances in O(V³) and tolerates
        negative edge weights (both `Infinity` and `0` off-diagonal mean "no
        edge"); a negative value left on the diagonal after the triple loop
        indicates a negative cycle through that node, but this is not flagged —
        use `bellmanFord` for explicit detection.
      - `bellmanFord` returns `{ dist, hasNegativeCycle }` for a single source,
        relaxing all edges `|V|-1` times then one more pass to detect a
        negative-weight cycle reachable from the source.
      - `closenessCentrality`/`harmonicCentrality` are built on `floydWarshall` and
        match `networkx.closeness_centrality`/`harmonic_centrality`'s directed-graph
        default: they sum _incoming_ distances to a node (how reachable it is from
        the rest of the graph), not outgoing. `closenessCentrality` applies the
        Wasserman–Faust disconnected-graph scaling `(r-1)/(n-1) · (r-1)/Σd`, which
        reduces to `(n-1)/Σd` when every node is reachable.
      - `maxFlow`/`minCut` treat `capacity` as a directed adjacency matrix (0 or
        negative = no edge). `maxFlow` runs Edmonds-Karp (Ford-Fulkerson with BFS
        shortest-augmenting-path selection, O(V·E²)); `minCut` reuses its residual
        graph and BFSes from `source` — reachable nodes form the `S` partition,
        the rest `T` — with `value` equal to the max-flow value by the
        max-flow-min-cut theorem. Pinned against `networkx.maximum_flow_value`.
      - `astar` runs A\* on a weighted adjacency matrix (finite, nonzero
        `adj[i][j]` = edge i → j) guided by an admissible `heuristic(node)`
        estimating remaining cost to `goal`; passing `() => 0` reduces it to plain
        Dijkstra. Returns `{ path: [], cost: Infinity }` when `goal` is
        unreachable.
      - `hungarian` finds the cost-minimizing assignment on a square `cost`
        matrix via the classical O(n³) Kuhn-Munkres (Hungarian) algorithm with
        row/column potentials and shortest augmenting paths;
        `assignment[i]` is the column assigned to row `i`. Pinned against
        `scipy.optimize.linear_sum_assignment`.
      - `betweennessCentrality` accepts a `normalized` option (American spelling)
        as an alias for the pre-existing `normalise`; when both are given,
        `normalized` wins. Both default to `true`, dividing by `(n-1)(n-2)` —
        the same divisor for directed AND undirected graphs, matching
        `networkx.betweenness_centrality`'s default `endpoints=False` scaling
        (the raw Brandes accumulation naturally double-counts each undirected
        unordered pair `{s,t}` by running a source BFS from both `s` and `t`, so
        no extra `/2` is needed). **Root-cause fix:** the undirected branch
        previously divided by `(n-1)(n-2)/2` instead, making normalised
        undirected betweenness exactly 2x too large — caught while oracle-pinning
        against `nx.betweenness_centrality(G, normalized=True)`.
      - `graphColoring` assigns each vertex a color index via the Welsh-Powell
        greedy heuristic (descending-degree order, ties broken by ascending
        vertex index for determinism): always a _proper_ coloring (no edge
        connects two same-colored vertices), but not guaranteed to use the
        chromatic number of colors (graph coloring is NP-hard in general).
      - `maxClique` finds an exact maximum clique via Bron-Kerbosch with pivoting
        — exponential worst-case, intended for small-to-moderate graphs.
      - `louvainCommunities` runs the Louvain modularity-maximization algorithm
        (local-moving + aggregation phases) on a weighted undirected adjacency
        matrix. Deterministic: nodes are visited in ascending index order each
        pass, and a node only moves to a new community when the modularity gain
        strictly exceeds its current community's gain by more than `1e-12` — no
        random seed is used, so the same graph always yields the same partition.
        Heuristic (not guaranteed globally optimal).
      - `katzCentrality(adj, alpha[, beta=1])` solves
        `x = (I - alpha·Aᵀ)⁻¹ (beta·1)` directly (Gaussian elimination with
        partial pivoting), then L2-normalizes by `sign(Σx)·‖x‖₂` — matching
        `networkx.katz_centrality_numpy` exactly, including its "use `Aᵀ` so
        directed graphs measure in-edges" default. `alpha` must be strictly
        less than `1/λ_max(A)` or the linear system is singular (throws).
      - `isIsomorphic(graphA, graphB)` tests whether a vertex bijection exists
        preserving all edges, via backtracking with a sorted (out-degree,
        in-degree) quick-reject followed by incremental consistency checks.
        Sound and complete (not a heuristic), but exponential worst-case.

      ### Background & History

      Graph theory began with a recreational puzzle: in 1736 Leonhard Euler proved
      that no walk could cross each of the seven bridges of Königsberg exactly once,
      founding the field in the process. Its algorithmic core is much more recent —
      Edsger Dijkstra published his shortest-path algorithm in 1959, and the
      minimum-spanning-tree algorithms span Otakar Borůvka (1926), Joseph Kruskal
      (1956), and Robert Prim (1957). These algorithms underpin routing, network
      design, dependency resolution, and scheduling.

      ### Examples

      ```typescript
      import {
        adjacencyMatrix,
        shortestPath,
        minimumSpanningTree,
      } from '@danielsimonjr/mathts-functions';

      const adj = adjacencyMatrix(
        [
          [0, 1],
          [1, 2],
          [0, 2],
        ],
        3
      );
      shortestPath(adj, 0, 2); // [0, 2]
      minimumSpanningTree(adj); // MST edge list
      ```

      | `kolmogorovSmirnovTest(sample[, sample2])` | `KSTestResult`          | K-S test                                                                                                                                                                                                       |
      | `mannWhitneyTest(sample1, sample2)`        | `MannWhitneyResult`     | Mann–Whitney U test                                                                                                                                                                                            |
      | `shapiroWilkTest(sample)`                  | `ShapiroWilkResult`     | Normality test — Royston (1995) AS R94 W statistic and p-value (matches `scipy.stats.shapiro` to ~1e-8)                                                                                                        |
      | `principalComponentAnalysis(data[, k])`    | `PCAResult`             | PCA                                                                                                                                                                                                            |
      | `fTest(x, y)`                              | `FTestResult`           | Two-sample F-test for equality of variances (`F = s²₁/s²₂`, two-sided)                                                                                                                                         |
      | `jarqueBera(x)`                            | `JarqueBeraResult`      | Jarque–Bera normality test from sample skewness and excess kurtosis (χ²(2))                                                                                                                                    |

      | `wilcoxon(x[, y])`                         | `WilcoxonResult`        | Wilcoxon signed-rank test (paired/one-sample); `scipy.stats.wilcoxon(mode='approx', correction=True)`                                                                                                          |

      | `tukeyHSD(groups[, alpha])`                | `TukeyComparison[]`     | Tukey's HSD post-hoc test (Tukey–Kramer, studentized range); mirrors `scipy.stats.tukey_hsd`                                                                                                                   |
      | `chi2Contingency(table[, opts])`           | `Chi2ContingencyResult` | Chi-square test of independence with auto-expected counts, Yates continuity correction (2x2, default on), and Cramer's V; matches `scipy.stats.chi2_contingency`                                               |
      | `multipleTest(pValues, method)`            | `number[]`              | Multiple-testing p-value adjustment (`'bonferroni'`/`'holm'`/`'bh'`), original order preserved; matches `statsmodels.stats.multitest.multipletests`; equivalent alias of `multipleComparison` (same algorithm) |
      | `multipleComparison(pValues[, method])`    | `number[]`              | Multiple-testing p-value adjustment (`'bonferroni'`/`'holm'`/`'bh'`, default `'bh'`); equivalent alias of `multipleTest` (same algorithm, `statsmodels`-parity naming)                                         |

      ### Details

      - Each test returns a structured object containing at minimum the test
        statistic and a p-value, plus test-specific fields (degrees of freedom,
        significance flag, …).
      - The **parametric** tests (`studentTTest`, `anova`, `chiSquareTest`) assume an
        underlying distribution; the **nonparametric** tests (`mannWhitneyTest`,
        `kolmogorovSmirnovTest`) do not and are robust to non-normal data.
      - `shapiroWilkTest` checks a sample for normality — useful for deciding between
        parametric and nonparametric procedures.
      - `principalComponentAnalysis` returns the principal components and their
        explained-variance ratios; pass `k` to keep only the top components.

      ### Background & History

      Statistical hypothesis testing was built in the 1920s–30s by two competing
      schools: Ronald Fisher's significance testing and the decision-theoretic
      framework of Jerzy Neyman and Egon Pearson. The t-test was published by William
      Gosset ("Student") in 1908; Fisher introduced the analysis of variance. The
      nonparametric tests — Mann–Whitney (1947), Kolmogorov–Smirnov — were developed
      to draw conclusions without assuming a normal distribution. Principal component
      analysis goes back to Karl Pearson (1901) and Harold Hotelling (1933).

      ### Examples

      ```typescript
      import { studentTTest, anova } from '@danielsimonjr/mathts-functions';

      studentTTest([2.1, 2.5, 2.3], [3.1, 3.5, 2.9]);
      // { t, pValue, degreesOfFreedom, significant }
      ```

      ## Set Operations

      | Function                 | Description                                                       | Types | Accel |
      | ------------------------ | ----------------------------------------------------------------- | ----- | ----- |
      | `setUnion(a, b)`         | Union of two multisets                                            | Array | —     |
      | `setIntersect(a, b)`     | Intersection of two multisets                                     | Array | —     |
      | `setDifference(a, b)`    | Elements of `a` not in `b` (multiset difference)                  | Array | —     |
      | `setSymDifference(a, b)` | Symmetric difference of two multisets                             | Array | —     |
      | `setCartesian(a, b)`     | Cartesian product — all ordered pairs                             | Array | —     |
      | `setPowerset(a)`         | All subsets ordered by size                                       | Array | —     |
      | `setDistinct(a)`         | Distinct elements (remove duplicates)                             | Array | —     |
      | `setMultiplicity(e, a)`  | Count occurrences of element `e` in multiset `a`                  | Array | —     |
      | `setIsSubset(a, b)`      | True when every element of `a` (with multiplicity) appears in `b` | Array | —     |
      | `setSize(a[, unique])`   | Element count; pass `true` for distinct count                     | Array | —     |
      | `setIsSuperset(a, b)`    | True when every element of `b` (with multiplicity) appears in `a` | Array | —     |
      | `setEqual(a, b)`         | True when `a` and `b` are equal as multisets                      | Array | —     |
      | `setDisjoint(a, b)`      | True when `a` and `b` share no elements                           | Array | —     |

      ### Details

      - All ten functions (`setUnion`, `setIntersect`, `setDifference`,
        `setSymDifference`, `setCartesian`, `setPowerset`, `setDistinct`,
        `setMultiplicity`, `setIsSubset`, `setSize`) are **typed-layer**
        implementations; multi-dimensional input arrays are flattened before the
        operation.
      - Operations respect **multiset semantics**: duplicate elements count
        independently. `setMultiplicity` returns the count of a value; `setDistinct`
        removes duplicates; `setIsSubset` checks with multiplicity.
      - `setPowerset` produces `2ⁿ` subsets — guard the input size, as it grows
        exponentially.
      - `setCartesian` returns all ordered pairs `[x, y]`; `setSize` with `true`
        reports the count of unique values only.

      ### Background & History

      Set theory was created almost single-handedly by Georg Cantor in the 1870s and
      became, through the Zermelo–Fraenkel axioms, the standard foundation of modern
      mathematics. The operations here are the concrete, computational face of that
      theory — they support combinatorial enumeration, relational queries, and the
      canonicalisation steps inside symbolic computation.

      ### Examples

      ```typescript
      import { setUnion, setIntersect, setPowerset } from '@danielsimonjr/mathts-functions';

      setUnion([1, 2, 3], [2, 3, 4]); // [1, 2, 3, 4]
      setIntersect([1, 2, 3], [2, 3, 4]); // [2, 3]
      setPowerset([1, 2]); // [[], [1], [2], [1, 2]]
      ```

      ## Units

      | Function                 | Description                                |
      | ------------------------ | ------------------------------------------ |
      | `unit(value, unit)`      | Construct a `Unit`                         |
      | `createUnit(defs)`       | Define custom units (`factory_createUnit`) |
      | `to(unit, target)`       | Convert between units                      |
      | `toBest(unit)`           | Convert to the best-fitting prefix         |
      | `splitUnit(unit, parts)` | Split a unit into components               |

      ### Details

      - A `Unit` couples a numeric value with a physical dimension; `to` converts only
        between dimensionally compatible units and throws otherwise.
      - `toBest` selects the metric prefix that yields the most readable magnitude
        (e.g. `1500 m → 1.5 km`).
      - `createUnit` registers derived or custom units built from existing ones.
      - `splitUnit` decomposes a quantity into mixed parts (e.g. a length into feet
        and inches).

      ### Background & History

      Coherent systems of units descend from the metric system, adopted in France in
      1795, and the International System of Units (SI), established in 1960.
      Carrying units through a computation as first-class data turns dimensional
      analysis into an automatic check — catching exactly the class of mistake behind
      the 1999 loss of NASA's Mars Climate Orbiter, where pound-force and newton
      quantities were silently mixed.

      ### Examples

      ```typescript
      import { unit, to } from '@danielsimonjr/mathts-functions';

      const d = unit(100, 'km');
      to(d, 'mile'); // ≈ 62.137 mile
      to(unit(90, 'km/h'), 'm/s'); // 25 m/s
      ```

      `deuteronMass`, `efimovFactor`, `electricConstant`, `electronMass`,
      `elementaryCharge`, `faraday`, `fermiCoupling`, `fineStructure`,
      `firstRadiation`, `gasConstant`, `gravitationConstant`, `gravity`,
      `hartreeEnergy`, `inverseConductanceQuantum`, `josephson`, `klitzing`,
      `loschmidt`, `magneticConstant`, `magneticFluxQuantum`, `molarMass`,
      `molarMassC12`, `molarPlanckConstant`, `molarVolume`, `neutronMass`,
      `nuclearMagneton`, `planckCharge`, `planckConstant`, `planckLength`,
      `planckMass`, `planckTemperature`, `planckTime`, `protonMass`,
      `quantumOfCirculation`, `reducedPlanckConstant`, `rydberg`, `sackurTetrode`,
      `secondRadiation`, `speedOfLight`, `stefanBoltzmann`, `thomsonCrossSection`,
      `vacuumImpedance`, `weakMixingAngle`, `wienDisplacement`.

      ### Details

      - These names are plain numeric **values**, not functions — use them directly
        in expressions.
      - Values are SI and follow the CODATA recommended set; full magnitudes and
        units appear in [`constants.md`](./constants.md).
      - Constants fixed by the 2019 SI redefinition (`speedOfLight`, `planckConstant`,
        `elementaryCharge`, `boltzmann`, `avogadro`) are **exact** by definition.

      ### Background & History

      CODATA — the Committee on Data for Science and Technology — periodically
      publishes an internally consistent set of recommended values for the physical
      constants, reconciling the world's best measurements through a least-squares
      adjustment. The 2019 redefinition of the SI base units was a turning point: by
      fixing the numerical values of `h`, `e`, `k`, and `N_A`, the kilogram, ampere,
      kelvin, and mole are now defined in terms of constants of nature rather than
      physical artefacts.

      speedOfLight; // 299792458       (m/s, exact since the 2019 SI redefinition)
      planckConstant; // 6.62607015e-34  (J·s, exact since 2019)
      boltzmann; // 1.380649e-23    (J/K, exact since 2019)

      ## Complex Number Utilities

      | Function  | Description                                           | Types                                     | Accel |
      | --------- | ----------------------------------------------------- | ----------------------------------------- | ----- |
      | `arg(z)`  | Phase angle in radians — `atan2(im, re)`              | number, bigint, BigNumber, Complex, Array | —     |
      | `conj(z)` | Complex conjugate — negates the imaginary part        | number, bigint, BigNumber, Complex, Array | —     |
      | `re(z)`   | Real part — identity for real types, `re` for Complex | number, bigint, BigNumber, Complex, Array | —     |
      | `im(z)`   | Imaginary part — 0 for real types, `im` for Complex   | number, bigint, BigNumber, Complex, Array | —     |

      ### Details

      - All four functions (`arg`, `conj`, `re`, `im`) are **typed-layer**
        implementations with `Array` elementwise dispatch.
      - `arg` returns the phase (argument) in radians; for positive reals the result is
        `0`, for negative reals `π`. Range for `Complex` inputs: `(-π, π]`.
      - `conj` negates the imaginary part; for real types (`number`, `bigint`,
        `BigNumber`) it returns the value unchanged.
      - `re` and `im` extract the Cartesian components; for real types `re` returns the
        value itself and `im` returns `0`.

      ### Background & History

      Complex numbers were treated with deep suspicion for centuries — Rafael
      Bombelli first manipulated them in 1572, and the term "imaginary" itself records
      that distrust. They were made rigorous by the geometric interpretation of
      Caspar Wessel, Jean-Robert Argand, and Gauss around 1800. Today they are
      indispensable: AC circuit analysis, control theory, quantum mechanics, and
      signal processing all rely on the complex plane.

      ### Examples

      ```typescript
      import { arg, conj, re, im } from '@danielsimonjr/mathts-functions';
      import { Complex } from '@danielsimonjr/mathts-core';

      const z = new Complex(3, 4);
      re(z); // 3
      im(z); // 4
      arg(z); // ~0.9273  (atan2(4, 3))
      conj(z); // Complex(3, -4)
      ```

      ## Type Conversion

      Convert a value into a specific numeric or container type.

      | Function            | Description                                   |
      | ------------------- | --------------------------------------------- |
      | `number(x)`         | Convert to a primitive `number`               |
      | `bigint(x)`         | Convert to a `bigint`                         |
      | `bignumber(x)`      | Convert to an arbitrary-precision `BigNumber` |
      | `fraction(x)`       | Convert to an exact `Fraction`                |
      | `complex(re[, im])` | Convert to / construct a `Complex`            |
      | `matrix(data)`      | Convert to a dense `DenseMatrix`              |
      | `sparse(data)`      | Convert to a `SparseMatrix` (CSC storage)     |
      | `string(x)`         | Convert to a `string`                         |
      | `boolean(x)`        | Convert to a `boolean`                        |

      The factory-layer `numeric(x, type)` (see below) is a single-entry dispatcher
      over the same conversions.

      ### Details

      - Conversions to `BigNumber` and `Fraction` are **exact** when the source
        permits; converting _out_ of them (`number`) is lossy and may round.
      - Convert from a string for exactness — `bignumber('0.1')` is the true value
        one-tenth, whereas `bignumber(0.1)` first inherits the binary rounding error
        of the literal `0.1`.
      - `matrix` produces dense storage; `sparse` produces compressed-sparse-column
        storage suited to matrices that are mostly zero.

      ### Background & History

      A library that supports several numeric representations needs an explicit,
      visible boundary between them. These functions are that boundary. The crucial
      distinction is between the **exact** types — `Fraction` and `BigNumber`, which
      carry no rounding error — and the fast, fixed-width IEEE-754 `number`. Making
      each crossing an explicit call keeps a programmer in deliberate control of when
      precision is traded for speed.

      ### Examples

      ```typescript
      import { fraction, bignumber, complex } from '@danielsimonjr/mathts-functions';

      fraction(0.25); // Fraction(1, 4)
      bignumber('0.1'); // exact BigNumber 0.1 (no binary rounding error)
      complex(2, 3); // Complex(2, 3)
      ```

      ## Type Checking & Utilities

      | Function                                        | Description                        |
      | ----------------------------------------------- | ---------------------------------- |
      | `typeOf(x)`                                     | Runtime type name                  |
      | `clone(x)`                                      | Deep clone                         |
      | `numeric(x, type)`                              | Convert to a numeric type          |
      | `isNumeric(x)` / `hasNumericValue(x)`           | Numeric tests                      |
      | `isNaN(x)` / `isFinite(x)` / `isBounded(x)`     | Value tests                        |
      | `isZero(x)` / `isPositive(x)` / `isNegative(x)` | Sign tests                         |
      | `isInteger(x)`                                  | Integer test                       |
      | `isPrime(x)`                                    | Primality test                     |
      | `format(x[, opts])`                             | Format a value as a string         |
      | `print(template, values)`                       | Interpolate values into a template |
      | `bin(x)` / `hex(x)` / `oct(x)`                  | Binary / hex / octal string        |
      | `chain(value)`                                  | Start a chained-operation `Chain`  |

      ### Details

      - `typeOf` returns the MathTS runtime type name (`'Complex'`, `'Fraction'`,
        `'DenseMatrix'`, …) — more informative than the JavaScript `typeof` operator.
      - The `is*` predicates accept any supported numeric type, not just `number`.
      - `format` accepts options for precision and notation; `bin`, `hex`, and `oct`
        produce radix string representations.
      - `chain(value)` opens a fluent `Chain` so that operations can be written
        left-to-right; finish with `.done()` to read the result.

      ### Background & History

      In a polymorphic library where a single function name accepts numbers,
      fractions, complex numbers, big numbers, and matrices alike, a reliable
      reflection API is not a convenience but a necessity. These utilities let calling
      code inspect a value's type, test its properties, and present it for display —
      the connective tissue that makes type-generic mathematical programming practical.

      ### Examples

      ```typescript
      import { typeOf, isPrime, isInteger, format } from '@danielsimonjr/mathts-functions';
      import { Complex } from '@danielsimonjr/mathts-core';

      typeOf(new Complex(1, 2)); // 'Complex'
      isPrime(97); // true
      isInteger(4.0); // true
      format(1 / 3, { precision: 4 }); // '0.3333'
      ```

      ## Expression Evaluation

      | Function                  | Description                                                                      |
      | ------------------------- | -------------------------------------------------------------------------------- |
      | `evaluate(expr[, scope])` | Evaluate an expression string                                                    |
      | `compileExpr(expr)`       | Compile once, evaluate many                                                      |
      | `parse(expr)`             | Parse an expression into an AST node                                             |
      | `parser()`                | Create a stateful parser with a scope retained across calls                      |
      | `reviver(key, value)`     | `JSON.parse` reviver — restores `Complex`, `Fraction`, non-finite numbers        |
      | `replacer(key, value)`    | `JSON.stringify` replacer — serialises `Complex`, `Fraction`, non-finite numbers |

      ### Details

      - `evaluate` parses and evaluates in one call; `compileExpr` compiles once and
        is far faster when the same expression is evaluated repeatedly with different
        variable bindings.
      - `parse` returns the abstract syntax tree as a `Node`, which can be inspected,
        transformed, or fed to the symbolic-algebra functions.
      - `parser()` creates a stateful evaluator that retains variable and function
        definitions across calls.
      - Property and method access inside expressions is routed through sandbox
        helpers — a deliberate security boundary so that user-supplied formulas cannot
        reach arbitrary JavaScript.

      ### Background & History

      A safe expression evaluator lets an application accept user-entered formulas
      without resorting to JavaScript's `eval`, which would expose the entire runtime.
      This is the same design that distinguishes mathjs from naive calculators: the
      parser builds an explicit syntax tree, and every member access is checked
      against an allow-list. The result is a feature that doubles as a security
      boundary.

      ### Examples

      ```typescript
      import { evaluate, compileExpr } from '@danielsimonjr/mathts-functions';

      evaluate('2 + 3 * 4'); // 14
      evaluate('pi * r^2', { r: 5 }); // 78.5398...

      const fn = compileExpr('x^2 + 2*x + 1');
      fn.evaluate({ x: 3 }); // 16
      ```

      ## Parallel Execution Model

      ### Details

      - `Float64Array` (and large-matrix) inputs to the typed functions return a
        `Promise` of the result value directly — `Promise<Float64Array>` for
        element-wise transforms, `Promise<number>` for reductions. Await the call.
      - The worker pool is created lazily on first use. `initializePool()`,
        `getComputePool()`, and `terminatePool()` give explicit lifecycle control —
        call `terminatePool()` to release worker threads, for example before process
        exit.
      - Small inputs run sequentially even on a `parallel`-marked function; the
        library dispatches to workers only when the array is large enough for the
        work to outweigh the dispatch overhead, and only once the pool has been
        initialized — otherwise it falls back to a synchronous in-thread path.
      - The lower-level `ComputePool` API (`computePool.add`, `.matmul`,
        `.applyKernel`, …) returns a `ParallelResult` wrapper that carries `.result`,
        `.duration` (elapsed milliseconds), `.chunks` (number of work chunks), and
        `.parallelized` (whether worker threads were actually used).

      ### Background & History

      MathTS is "parallel-first": rather than treating multi-threading as an opt-in
      optimisation, array transforms are designed from the start to fan out across
      Web Worker threads. This reflects the hardware reality that single-core clock
      speeds plateaued in the mid-2000s and that performance gains now come from
      parallelism. The worker-pool pattern — a fixed set of reusable worker threads
      fed by a task queue — is the standard way to exploit those cores without paying
      thread-creation costs on every call.

      ### Examples

      ```typescript
      import { add, initializePool, terminatePool } from '@danielsimonjr/mathts-functions';

      await initializePool();
      const sum = await add(new Float64Array([1, 2, 3]), new Float64Array([4, 5, 6]));
      // sum → Float64Array([5, 7, 9])
      await terminatePool();
      ```

        /* ---- sidebar ---- */
        var sideHtml = '<h3>Categories</h3>';
        sections.forEach(function (s) {
          var n = s.el.querySelectorAll('tbody tr').length;
          sideHtml +=
            '<a href="#' +
            s.id +
            '" data-target="' +
            s.id +
            '">' +
            '<span class="sidenum">' +
            s.num +
            '</span>' +
            '<span class="sidename">' +
            escapeHtml(s.title) +
            '</span>' +
            (n > 0 ? '<span class="count">' + n + '</span>' : '') +
            '</a>';
        });
        sidebar.innerHTML = sideHtml;
        var links = Array.prototype.slice.call(sidebar.querySelectorAll('a'));

        /* ---- expand / collapse ---- */
        function setAll(open) {
          Array.prototype.slice
            .call(document.querySelectorAll('details.panel'))
            .forEach(function (d) {
              d.open = open;
            });
        }
        document.getElementById('expandAll').addEventListener('click', function () {
          setAll(true);
        });
        document.getElementById('collapseAll').addEventListener('click', function () {
          setAll(false);
        });

        /* ---- search / filter ---- */
        var search = document.getElementById('search');
        function applyFilter() {
          var q = search.value.trim().toLowerCase();
          var anyVisible = false;
          sections.forEach(function (s) {
            var secMatch = !q || s.title.toLowerCase().indexOf(q) >= 0;
            var shown = 0;
            var trs = Array.prototype.slice.call(s.el.querySelectorAll('tbody tr'));
            trs.forEach(function (tr) {
              var show = !q || secMatch || tr.textContent.toLowerCase().indexOf(q) >= 0;
              tr.style.display = show ? '' : 'none';
              if (show) shown++;
            });
            var visible = !q || secMatch || shown > 0;
            s.el.style.display = visible ? '' : 'none';
            if (visible) anyVisible = true;
            var link = sidebar.querySelector('a[data-target="' + s.id + '"]');
            if (link) link.style.display = visible ? '' : 'none';
          });
          noRes.style.display = anyVisible ? 'none' : '';
        }
        search.addEventListener('input', applyFilter);

        /* ---- scroll-spy ---- */
        function onScroll() {
          var active = null;
          sections.forEach(function (s) {
            if (s.el.style.display === 'none') return;
            if (s.el.getBoundingClientRect().top <= 110) active = s;
          });
          if (!active) {
            for (var k = 0; k < sections.length; k++) {
              if (sections[k].el.style.display !== 'none') {
                active = sections[k];
                break;
              }
            }
          }
          links.forEach(function (a) {
            a.classList.toggle('active', !!active && a.getAttribute('data-target') === active.id);
          });
        }
        window.addEventListener('scroll', onScroll, { passive: true });
        onScroll();

        /* ---- "/" focuses the search box ---- */
        document.addEventListener('keydown', function (e) {
          if (e.key === '/' && document.activeElement !== search) {
            e.preventDefault();
            search.focus();
          }
        });
      })();
    </script>
  </body>
</html>
